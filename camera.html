<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>QR Check-in/out</title>

<script
  src="https://unpkg.com/html5-qrcode">
</script>

<style>

:root{
  --bg:#fafafa;
  --card:#fff;
  --border:#e5e7eb;
  --ok:#065f46;
  --err:#b00020;
  --muted:#6b7280;
}

*{
  box-sizing:border-box;
}

body{
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  margin:12px;

  background:
    var(--bg);
}

.wrap{
  max-width:1100px;
  margin:auto;
}

.card{
  background:var(--card);

  border:
    1px solid var(--border);

  border-radius:16px;

  padding:16px;

  margin:12px 0;

  box-shadow:
    0 1px 2px rgba(0,0,0,.04);
}

.brand{
  text-align:center;
}

.brand img{
  max-width:96px;
  border-radius:12px;
  display:block;
  margin:0 auto 8px;
}

.brand h1{
  font-size:20px;
  margin:0;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-top:4px;
}

#scanner{
  min-height:320px;
}

.ok{
  color:var(--ok);
  font-weight:700;
}

.err{
  color:var(--err);
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

@media (min-width:900px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

}

.board h3{
  margin:0 0 8px 0;

  display:flex;

  align-items:center;

  gap:8px;
}

.count{
  font-size:12px;

  color:var(--muted);

  border:
    1px solid var(--border);

  border-radius:999px;

  padding:2px 8px;
}

.list{
  display:grid;

  grid-template-columns:1fr;

  gap:8px;
}

.item{
  display:flex;

  justify-content:space-between;

  align-items:center;

  border:
    1px solid var(--border);

  border-radius:12px;

  padding:10px;
}

.name{
  font-weight:700;
}

.meta{
  color:var(--muted);

  font-size:12px;
}

.status-over{
  background:#fee2e2;

  border-color:#fecaca;
}

button{
  padding:8px 12px;

  border-radius:10px;

  border:
    1px solid var(--border);

  background:#fff;

  cursor:pointer;
}

.banner{
  font-size:12px;

  color:#92400e;

  background:#fef3c7;

  border:
    1px solid #fcd34d;

  border-radius:10px;

  padding:8px;

  margin-top:8px;

  display:none;
}

.controls{
  display:flex;

  gap:8px;

  justify-content:center;

  flex-wrap:wrap;
}

</style>

</head>


<body>


<div class="wrap">


  <!-- =================================================
       HEADER
  ================================================== -->

  <div class="brand card">

    <img
      src=""
      alt="School Logo"
    >

    <h1>
      Kumon Tukcom
    </h1>

    <div class="subtitle">
      สแกน QR เข้า–ออก | วิชา: เลข / อังกฤษ / ไทย (TRP) — ห้ามซ้อนวิชา
    </div>

    <div
      id="hint"
      class="banner"
    >
      ไม่ได้ยินเสียง?
      แตะที่หน้าจอหนึ่งครั้ง
      เพื่ออนุญาตการเล่นเสียง
    </div>

  </div>


  <!-- =================================================
       SCANNER
  ================================================== -->

  <div
    id="scanner"
    class="card"
  ></div>


  <!-- =================================================
       CAMERA BUTTONS
  ================================================== -->

  <div class="card controls">

    <button
      onclick="startScan()"
    >
      เริ่มสแกน
    </button>

    <button
      onclick="stopScan()"
    >
      หยุดสแกน
    </button>

    <button
      onclick="switchCamera()"
    >
      สลับกล้อง
    </button>

  </div>


  <!-- =================================================
       RESULT
  ================================================== -->

  <div
    id="result"
    class="card"
  >
    พร้อมใช้งาน
  </div>


  <!-- =================================================
       STATUS BOARD
  ================================================== -->

  <div class="grid">


    <div class="board card">

      <h3>

        กำลังเรียน:
        ห้องเลข (MATH)

        <span
          id="count-math"
          class="count"
        >
          0 คน
        </span>

      </h3>


      <div
        id="list-math"
        class="list"
      ></div>

    </div>


    <div class="board card">

      <h3>

        กำลังเรียน:
        ห้องภาษา (ENG + TRP)

        <span
          id="count-lang"
          class="count"
        >
          0 คน
        </span>

      </h3>


      <div
        id="list-lang"
        class="list"
      ></div>

    </div>


  </div>


</div>


<!-- =====================================================
     SOUND
===================================================== -->

<audio
  id="beep"
  src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
  preload="auto"
></audio>


<audio
  id="squeak"
  src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
  preload="auto"
></audio>


<script>


/* =====================================================
   APPS SCRIPT URL
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec';


/* =====================================================
   BRANCH / DEVICE
===================================================== */

const BRANCH_ID =
  'B001';


const DEVICE_ID =
  'B001-01';


/* =====================================================
   GLOBAL
===================================================== */

let qr = null;

let busy = false;

let audioArmed = false;


/* =====================================================
   CAMERA CONFIG
===================================================== */

const SCAN_FPS =
  10;


const QR_BOX =
  250;


const LS_KEY_ID =
  'qr_last_device_id';


const LS_KEY_FACING =
  'qr_last_facing';


let cameras = [];

let currentCameraId =
  null;


let currentFacing =
  'environment';


let isStarting =
  false;


/* =====================================================
   ELEMENTS
===================================================== */

const resultEl =
  document.getElementById(
    'result'
  );


const beep =
  document.getElementById(
    'beep'
  );


const squeak =
  document.getElementById(
    'squeak'
  );


const hint =
  document.getElementById(
    'hint'
  );


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  startScanner
);


document.addEventListener(
  'visibilitychange',
  () => {

    if (
      document.visibilityState ===
      'visible' &&
      !busy
    ) {

      restartScanner();

    }

  }
);


/* =====================================================
   ARM AUDIO
===================================================== */

document.body.addEventListener(
  'pointerdown',
  async () => {

    if (audioArmed) {
      return;
    }

    audioArmed = true;

    hint.style.display =
      'none';

    try {

      await beep.play();

      beep.pause();

      beep.currentTime =
        0;

    }

    catch(e) {}

  },
  {
    once:true
  }
);


/* =====================================================
   UTILS
===================================================== */

const $ =
  id =>
    document.getElementById(id);


function safeBeep(){

  beep
    .play()
    .catch(
      () => {

        hint.style.display =
          'block';

      }
    );

}


function safeErr(){

  squeak
    .play()
    .catch(
      () => {

        hint.style.display =
          'block';

      }
    );

}


function showErr(
  msg
){

  resultEl.innerHTML =
    `<div class="err">
      ✖ ${escapeHtml(msg)}
    </div>`;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   SHOW SUCCESS
===================================================== */

function showOK(
  msg
){

  resultEl.innerHTML =
    `<div class="ok">
      ✔ ${escapeHtml(msg)}
    </div>`;

}


/* =====================================================
   APPS SCRIPT JSONP
===================================================== */

function apiCall(
  action,
  params = {}
){

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callbackName =
        'githubApi_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams();


      query.set(
        'api',
        '1'
      );


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object.keys(
        params
      ).forEach(
        key => {

          const value =
            params[key];


          if (
            value !== undefined &&
            value !== null
          ) {

            query.set(
              key,
              String(value)
            );

          }

        }
      );


      let finished =
        false;


      const timeout =
        setTimeout(
          () => {

            if (finished) {
              return;
            }

            finished =
              true;


            cleanup();


            reject(
              new Error(
                'Apps Script API timeout'
              )
            );

          },
          15000
        );


      function cleanup(){

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        }

        catch(e){}


        if (
          script.parentNode
        ){

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        response => {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (
            !response ||
            response.success !== true
          ){

            reject(
              new Error(
                response &&
                response.error
                  ? response.error
                  : 'Apps Script API Error'
              )
            );


            return;

          }


          resolve(
            response.data
          );

        };


      script.onerror =
        () => {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              'เชื่อมต่อ Apps Script ไม่สำเร็จ'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        query.toString();


      document.head.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   GET CAMERAS
===================================================== */

async function getCamerasFresh(){

  try {

    cameras =
      await Html5Qrcode
        .getCameras();

  }

  catch(e){

    cameras =
      [];

  }


  return cameras;

}


/* =====================================================
   PICK DEFAULT CAMERA
===================================================== */

function pickDefaultDeviceId(
  list
){

  const last =
    localStorage.getItem(
      LS_KEY_ID
    );


  if (
    last &&
    list.some(
      c =>
        c.id === last
    )
  ){

    return last;

  }


  const back =
    list.find(
      c =>
        /back|rear|environment/i
          .test(
            c.label || ''
          )
    );


  return (
    back &&
    back.id
  ) ||
  (
    list[0] &&
    list[0].id
  ) ||
  null;

}


/* =====================================================
   START BY DEVICE ID
===================================================== */

async function tryStartWithDeviceId(
  deviceId
){

  await stopScanner();


  await qr.start(

    {
      deviceId:{
        exact:
          deviceId
      }
    },

    {
      fps:
        SCAN_FPS,

      qrbox:
        QR_BOX
    },

    onScanSuccess,

    () => {}

  );


  currentCameraId =
    deviceId;


  currentFacing =
    null;


  localStorage.setItem(
    LS_KEY_ID,
    deviceId
  );


  localStorage.removeItem(
    LS_KEY_FACING
  );

}


/* =====================================================
   START BY FACING MODE
===================================================== */

async function tryStartWithFacingMode(
  facing
){

  await stopScanner();


  await qr.start(

    {
      facingMode:
        facing
    },

    {
      fps:
        SCAN_FPS,

      qrbox:
        QR_BOX
    },

    onScanSuccess,

    () => {}

  );


  currentFacing =
    facing;


  currentCameraId =
    null;


  localStorage.setItem(
    LS_KEY_FACING,
    facing
  );

}


/* =====================================================
   SMART CAMERA
===================================================== */

async function startCameraSmart({

  deviceId = null,

  facing = null

} = {}){

  if (isStarting) {
    return;
  }


  isStarting =
    true;


  try {


    if (deviceId){

      try {

        await tryStartWithDeviceId(
          deviceId
        );

        return;

      }

      catch(e){

        console.warn(
          'deviceId start failed:',
          e
        );

      }

    }


    if (facing){

      try {

        await tryStartWithFacingMode(
          facing
        );

        return;

      }

      catch(e){

        console.warn(
          'facing start failed:',
          e
        );

      }

    }


    const list =
      await getCamerasFresh();


    const defId =
      pickDefaultDeviceId(
        list
      );


    if (defId){

      try {

        await tryStartWithDeviceId(
          defId
        );

        return;

      }

      catch(e){

        console.warn(
          'default deviceId failed',
          e
        );

      }

    }


    const lastFacing =
      localStorage.getItem(
        LS_KEY_FACING
      ) ||
      'environment';


    try {

      await tryStartWithFacingMode(
        lastFacing
      );

      return;

    }

    catch(e){

      const alt =
        lastFacing ===
        'environment'
          ? 'user'
          : 'environment';


      await tryStartWithFacingMode(
        alt
      );

    }

  }

  finally {

    isStarting =
      false;

  }

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

  try {


    const list =
      await getCamerasFresh();


    if (
      currentCameraId &&
      list.length >= 2
    ){

      const idx =
        list.findIndex(
          c =>
            c.id ===
            currentCameraId
        );


      const next =
        list[
          (idx + 1) %
          list.length
        ];


      await startCameraSmart({
        deviceId:
          next.id
      });


      return;

    }


    const nowFacing =
      currentFacing ||
      localStorage.getItem(
        LS_KEY_FACING
      ) ||
      'environment';


    const nextFacing =
      nowFacing ===
      'environment'
        ? 'user'
        : 'environment';


    await startCameraSmart({
      facing:
        nextFacing
    });


  }

  catch(e){

    showErr(
      'สลับกล้องไม่สำเร็จ: ' +
      (
        e &&
        e.message
          ? e.message
          : e
      )
    );

  }

}


/* =====================================================
   STOP
===================================================== */

function stopScanner(){

  if (!qr){
    return Promise.resolve();
  }


  try {

    return qr
      .stop()
      .then(
        () =>
          qr.clear()
      )
      .catch(
        () => {}
      );

  }

  catch(e){

    return Promise.resolve();

  }

}


/* =====================================================
   RESTART
===================================================== */

async function restartScanner(){

  const lastId =
    localStorage.getItem(
      LS_KEY_ID
    );


  const lastFacing =
    localStorage.getItem(
      LS_KEY_FACING
    ) ||
    'environment';


  await startCameraSmart({

    deviceId:
      lastId || null,

    facing:
      lastId
        ? null
        : lastFacing

  });

}


/* =====================================================
   INITIAL START
===================================================== */

async function startScanner(){

  try {

    if (!qr){

      qr =
        new Html5Qrcode(
          'scanner'
        );

    }


    const lastId =
      localStorage.getItem(
        LS_KEY_ID
      );


    const lastFacing =
      localStorage.getItem(
        LS_KEY_FACING
      ) ||
      'environment';


    await startCameraSmart({

      deviceId:
        lastId || null,

      facing:
        lastId
          ? null
          : lastFacing

    });

  }

  catch(e){

    showErr(
      'เริ่มสแกนไม่สำเร็จ: ' +
      (
        e &&
        e.message
          ? e.message
          : e
      )
    );


    hint.style.display =
      'block';

  }


  refreshBoards();


  setInterval(
    refreshBoards,
    8000
  );

}


/* =====================================================
   PUBLIC BUTTONS
===================================================== */

async function startScan(){

  await restartScanner();

}


function stopScan(){

  stopScanner();

}


window.startScan =
  startScan;


window.stopScan =
  stopScan;


window.switchCamera =
  switchCamera;


/* =====================================================
   SCAN SUCCESS
===================================================== */

async function onScanSuccess(
  decodedText
){

  if (busy){
    return;
  }


  busy =
    true;


  /*
   * หยุด scanner ก่อน
   */

  await stopScanner();


  /*
   * แสดงสถานะ
   */

  resultEl.innerHTML =
    '<div>กำลังตรวจสอบและบันทึก...</div>';


  try {


    /*
     * ส่ง QR ไป Apps Script
     */

    const res =
      await apiCall(

        'log',

        {

          payload:
            decodedText,

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID

        }

      );


    /*
     * สำเร็จ
     */

    safeBeep();


    const extra =
      (
        res &&
        res.durationMin !== '' &&
        res.durationMin !== null &&
        res.durationMin !== undefined
      )

      ?

      ` (อยู่ในวิชา ${res.subject} ${res.durationMin} นาที${res.flag ? ' ⏰' : ''})`

      :

      ` (วิชา ${res.subject})`;


    showOK(

      (
        res.fullName ||
        res.studentId
      ) +

      ' : ' +

      res.direction +

      ' @ ' +

      res.time +

      extra

    );


    busy =
      false;


    /*
     * Refresh board
     */

    refreshBoards();


    /*
     * สแกนต่อ
     */

    setTimeout(
      () => {

        restartScanner();

      },
      700
    );


  }

  catch(e){

    safeErr();


    showErr(

      e &&
      e.message

        ? e.message

        : String(e)

    );


    busy =
      false;


    setTimeout(
      () => {

        restartScanner();

      },
      1200
    );

  }

}


/* =====================================================
   STATUS BOARD
===================================================== */

function refreshBoards(){


  /*
   * MATH
   */

  apiCall(

    'math',

    {
      branch:
        BRANCH_ID
    }

  )

  .then(
    list => {

      list =
        Array.isArray(list)
          ? list
          : [];


      renderBoard(
        'list-math',
        list
      );


      document
        .getElementById(
          'count-math'
        )
        .textContent =
          `${list.length} คน`;

    }
  )

  .catch(
    error => {

      console.warn(
        'MATH board:',
        error
      );

    }
  );


  /*
   * LANGUAGE
   */

  apiCall(

    'language',

    {
      branch:
        BRANCH_ID
    }

  )

  .then(
    list => {

      list =
        Array.isArray(list)
          ? list
          : [];


      renderBoard(
        'list-lang',
        list
      );


      document
        .getElementById(
          'count-lang'
        )
        .textContent =
          `${list.length} คน`;

    }
  )

  .catch(
    error => {

      console.warn(
        'LANG board:',
        error
      );

    }
  );

}


/* =====================================================
   RENDER BOARD
===================================================== */

function renderBoard(
  containerId,
  items
){

  const box =
    document.getElementById(
      containerId
    );


  if (
    !Array.isArray(items) ||
    items.length === 0
  ){

    box.innerHTML =
      '<div class="meta">— ไม่มีคนกำลังเรียน —</div>';


    return;

  }


  box.innerHTML =
    items
      .map(
        it => {

          const klass =
            it.over
              ? 'item status-over'
              : 'item';


          const mins =
            typeof it.minutes ===
            'number'

              ? `${it.minutes} นาที`

              : '-';


          return `

            <div class="${klass}">

              <div>

                <div class="name">

                  ${escapeHtml(
                    it.fullName ||
                    it.studentId
                  )}

                </div>

                <div class="meta">

                  วิชา:
                  ${escapeHtml(
                    it.subject
                  )}

                  • อยู่มา:
                  ${mins}

                  ${
                    it.over
                      ? ' • เกินเวลา'
                      : ''
                  }

                </div>

              </div>

              <div>

                <button
                  onclick="checkout('${escapeHtml(it.studentId)}')"
                >
                  Check-out
                </button>

              </div>

            </div>

          `;

        }
      )
      .join('');

}


/* =====================================================
   CHECKOUT
===================================================== */

async function checkout(
  studentId
){

  try {


    const res =
      await apiCall(

        'checkout',

        {

          studentId:
            studentId,

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID

        }

      );


    safeBeep();


    showOK(

      'เช็กเอาท์ ' +

      (
        res.fullName ||
        res.studentId
      ) +

      ' @ ' +

      res.time +

      ' (วิชา ' +

      res.subject +

      ')'

    );


    refreshBoards();

  }

  catch(e){

    safeErr();


    showErr(

      e &&
      e.message
        ? e.message
        : String(e)

    );

  }

}


window.checkout =
  checkout;
