<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta name="theme-color" content="#2563eb">

  <title>Kumon Central Korat - QR Attendance</title>

  <!-- =====================================================
       QR SCANNER LIBRARY
       ===================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f4f6fa;
      color: #111827;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      background: #ffffff;
      border-radius: 22px;
      padding: 22px 20px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
      margin-bottom: 18px;
    }

    .header-title {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.2;
    }

    .header-subtitle {
      margin-top: 8px;
      font-size: 21px;
      color: #6b7280;
      font-weight: 700;
    }

    .branch {
      margin-top: 10px;
      font-size: 17px;
      font-weight: 800;
      color: #374151;
    }

    /* =====================================================
       CAMERA
       ===================================================== */

    .camera-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
      margin-bottom: 16px;
    }

    #reader {
      width: 100%;
      min-height: 430px;

      background: #101827;

      border-radius: 18px;

      overflow: hidden;

      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;

      display: block;

      object-fit: cover;

      border-radius: 18px;
    }

    .camera-placeholder {
      min-height: 430px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;

      color: #d1d5db;

      font-size: 22px;
      font-weight: 800;
    }

    /* =====================================================
       SCAN FRAME
       ===================================================== */

    #scanFrame {
      display: none;

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width: min(320px, 65vw);
      height: min(320px, 65vw);

      border: 3px solid #ffffff;

      border-radius: 20px;

      pointer-events: none;

      z-index: 20;
    }

    #scanLine {
      position: absolute;

      left: 15px;
      right: 15px;

      top: 50%;

      height: 3px;

      background: #ef4444;
    }

    /* =====================================================
       STATUS
       ===================================================== */

    .status {
      border-radius: 16px;

      padding: 17px;

      margin-bottom: 16px;

      text-align: center;

      font-size: 20px;

      font-weight: 900;
    }

    .status.info {
      background: #e0e7ff;
      color: #3730a3;
    }

    .status.loading {
      background: #fef3c7;
      color: #92400e;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    /* =====================================================
       RESULT
       ===================================================== */

    #result {
      display: none;

      background: #ffffff;

      border-radius: 22px;

      padding: 22px;

      margin-bottom: 16px;

      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    #result.success {
      border: 2px solid #86efac;
      background: #f0fdf4;
    }

    #result.error {
      border: 2px solid #fca5a5;
      background: #fef2f2;
    }

    #studentName {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    #direction {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .result-line {
      font-size: 19px;
      font-weight: 700;
      margin: 8px 0;
    }

    #rawQR {
      margin-top: 16px;

      padding: 12px;

      border-radius: 10px;

      background: #e5e7eb;

      color: #374151;

      font-size: 14px;

      word-break: break-all;
    }

    /* =====================================================
       CONTROL BUTTONS
       ===================================================== */

    .controls {
      background: #ffffff;

      border-radius: 22px;

      padding: 16px;

      box-shadow: 0 5px 18px rgba(0,0,0,.07);

      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 12px;
    }

    button {
      border: none;

      border-radius: 14px;

      min-height: 64px;

      padding: 14px;

      font-size: 19px;

      font-weight: 900;

      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #startButton {
      background: #2563eb;
      color: white;
    }

    #stopButton {
      background: #ef4444;
      color: white;
    }

    #switchButton {
      background: #6b7280;
      color: white;
    }

    #againButton {
      width: 100%;

      margin-top: 18px;

      background: #16a34a;

      color: white;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 650px) {

      body {
        padding: 10px;
      }

      .header-title {
        font-size: 25px;
      }

      .header-subtitle {
        font-size: 18px;
      }

      .branch {
        font-size: 14px;
      }

      #reader,
      .camera-placeholder {
        min-height: 330px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      #studentName {
        font-size: 27px;
      }

      #direction {
        font-size: 24px;
      }

    }

  </style>
</head>


<body>

<div class="container">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div class="header">

    <div class="header-title">
      📷 Kumon Central Korat
    </div>

    <div class="header-subtitle">
      สแกน QR เข้า–ออก
    </div>

    <div class="branch">
      Branch: B001 | สาขาหลัก | Device: B001-01
    </div>

  </div>


  <!-- =====================================================
       CAMERA
       ===================================================== -->

  <div class="camera-card">

    <div id="reader">

      <div
        id="placeholder"
        class="camera-placeholder"
      >
        📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน
      </div>

      <div id="scanFrame">
        <div id="scanLine"></div>
      </div>

    </div>

  </div>


  <!-- =====================================================
       STATUS
       ===================================================== -->

  <div
    id="status"
    class="status info"
  >
    พร้อมเปิดกล้อง
  </div>


  <!-- =====================================================
       RESULT
       ===================================================== -->

  <div id="result">

    <div id="studentName">
      -
    </div>

    <div id="direction">
    </div>

    <div
      id="subject"
      class="result-line"
    >
    </div>

    <div
      id="time"
      class="result-line"
    >
    </div>

    <div
      id="duration"
      class="result-line"
    >
    </div>

    <div
      id="rawQR"
    >
    </div>

    <button
      id="againButton"
      onclick="scanAgain()"
    >
      🔍 สแกนคนถัดไป
    </button>

  </div>


  <!-- =====================================================
       BUTTONS
       ===================================================== -->

  <div class="controls">

    <button
      id="startButton"
      onclick="startCamera()"
    >
      📷 เปิดกล้อง
    </button>

    <button
      id="stopButton"
      onclick="stopCamera()"
      disabled
    >
      ⛔ ปิดกล้อง
    </button>

    <button
      id="switchButton"
      onclick="switchCamera()"
      disabled
    >
      🔄 สลับกล้อง
    </button>

  </div>


</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec";

const BRANCH_ID =
  "B001";

const DEVICE_ID =
  "B001-01";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let scanner = null;

let cameraRunning = false;

let processing = false;

let cameras = [];

let currentCameraIndex = 0;

let lastQR = "";

let lastQRTime = 0;


/* =========================================================
   ELEMENTS
   ========================================================= */

const reader =
  document.getElementById("reader");

const placeholder =
  document.getElementById("placeholder");

const scanFrame =
  document.getElementById("scanFrame");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const studentNameBox =
  document.getElementById("studentName");

const directionBox =
  document.getElementById("direction");

const subjectBox =
  document.getElementById("subject");

const timeBox =
  document.getElementById("time");

const durationBox =
  document.getElementById("duration");

const rawQRBox =
  document.getElementById("rawQR");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const switchButton =
  document.getElementById("switchButton");


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  text,
  type = "info"
) {

  statusBox.textContent =
    text;

  statusBox.className =
    "status " + type;

}


/* =========================================================
   BUTTON STATE
   ========================================================= */

function updateButtons() {

  startButton.disabled =
    cameraRunning ||
    processing;

  stopButton.disabled =
    !cameraRunning;

  switchButton.disabled =
    !cameraRunning ||
    cameras.length < 2;

}


/* =========================================================
   SOUND
   ========================================================= */

function beep(
  success = true
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );

    oscillator.frequency.value =
      success
        ? 1000
        : 400;

    gain.gain.value =
      0.15;

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.15
    );

  }
  catch(error) {

    console.log(
      "Audio error:",
      error
    );

  }

}


/* =========================================================
   CAMERA CONFIG
   ========================================================= */

function getScannerConfig() {

  return {

    fps: 10,

    qrbox: function(
      width,
      height
    ) {

      const size =
        Math.floor(
          Math.min(
            width,
            height
          ) * 0.65
        );

      return {

        width:
          Math.min(
            size,
            320
          ),

        height:
          Math.min(
            size,
            320
          )

      };

    },

    aspectRatio: 1.0

  };

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  if (
    cameraRunning ||
    processing
  ) {
    return;
  }

  try {

    if (
      typeof Html5Qrcode ===
      "undefined"
    ) {

      throw new Error(
        "ไม่พบระบบอ่าน QR Code"
      );

    }


    setStatus(
      "⏳ กำลังเปิดกล้อง...",
      "loading"
    );


    /*
     * สร้าง scanner ใหม่
     */

    if (scanner) {

      try {

        await scanner.clear();

      }
      catch(e) {}

    }


    reader.innerHTML = "";

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
     * พยายามใช้กล้องหลัง
     */

    try {

      await scanner.start(

        {
          facingMode: {
            ideal: "environment"
          }
        },

        getScannerConfig(),

        onScanSuccess,

        function() {}

      );

    }

    catch(environmentError) {

      console.log(
        "Environment camera failed:",
        environmentError
      );


      /*
       * ขอรายการกล้อง
       */

      cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "ไม่พบกล้องในอุปกรณ์"
        );

      }


      /*
       * หาตำแหน่งกล้องหลัง
       */

      let backIndex =
        cameras.findIndex(
          function(camera) {

            return /back|rear|environment|หลัง/i
              .test(
                camera.label || ""
              );

          }
        );


      if (backIndex < 0) {

        backIndex = 0;

      }


      currentCameraIndex =
        backIndex;


      await scanner.start(

        cameras[
          currentCameraIndex
        ].id,

        getScannerConfig(),

        onScanSuccess,

        function() {}

      );

    }


    cameraRunning =
      true;


    scanFrame.style.display =
      "block";


    /*
     * ขอรายการกล้องอีกครั้ง
     * หลังจาก permission ผ่านแล้ว
     */

    try {

      cameras =
        await Html5Qrcode.getCameras();


      if (
        cameras &&
        cameras.length > 0
      ) {

        const backIndex =
          cameras.findIndex(
            function(camera) {

              return /back|rear|environment|หลัง/i
                .test(
                  camera.label || ""
                );

            }
          );


        if (backIndex >= 0) {

          currentCameraIndex =
            backIndex;

        }

      }

    }
    catch(e) {

      console.log(
        "Camera list error:",
        e
      );

    }


    setStatus(
      "🟢 พร้อมสแกน QR",
      "success"
    );


    updateButtons();

  }

  catch(error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    cameraRunning =
      false;


    scanFrame.style.display =
      "none";


    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาต Camera";

    }


    setStatus(
      "❌ เปิดกล้องไม่สำเร็จ: " +
      message,
      "error"
    );


    updateButtons();

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

async function stopCamera() {

  if (!scanner) {

    cameraRunning =
      false;

    updateButtons();

    return;

  }


  try {

    if (cameraRunning) {

      await scanner.stop();

    }

  }
  catch(error) {

    console.log(
      "STOP CAMERA:",
      error
    );

  }


  cameraRunning =
    false;


  scanFrame.style.display =
    "none";


  reader.innerHTML =

    `
      <div class="camera-placeholder">
        📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน
      </div>
    `;


  setStatus(
    "พร้อมเปิดกล้อง",
    "info"
  );


  updateButtons();

}


/* =========================================================
   SWITCH CAMERA
   ========================================================= */

async function switchCamera() {

  if (
    !scanner ||
    processing
  ) {
    return;
  }


  try {

    setStatus(
      "⏳ กำลังสลับกล้อง...",
      "loading"
    );


    if (cameraRunning) {

      await scanner.stop();

      cameraRunning =
        false;

    }


    cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length < 2
    ) {

      throw new Error(
        "อุปกรณ์นี้พบกล้องเพียง 1 ตัว"
      );

    }


    currentCameraIndex =
      (
        currentCameraIndex + 1
      ) %
      cameras.length;


    await scanner.start(

      cameras[
        currentCameraIndex
      ].id,

      getScannerConfig(),

      onScanSuccess,

      function() {}

    );


    cameraRunning =
      true;


    scanFrame.style.display =
      "block";


    setStatus(
      "🟢 สลับกล้องสำเร็จ",
      "success"
    );


    updateButtons();

  }

  catch(error) {

    console.error(
      "SWITCH CAMERA ERROR:",
      error
    );


    cameraRunning =
      false;


    scanFrame.style.display =
      "none";


    setStatus(
      "❌ สลับกล้องไม่สำเร็จ: " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );


    updateButtons();

  }

}


/* =========================================================
   JSONP CALL TO APPS SCRIPT
   ========================================================= */

function callAppsScript(
  action,
  params = {}
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const callbackName =
        "kumon_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 1000000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams();


      query.set(
        "action",
        action
      );


      query.set(
        "callback",
        callbackName
      );


      Object.keys(params)
        .forEach(
          function(key) {

            const value =
              params[key];

            if (
              value !== undefined &&
              value !== null
            ) {

              query.set(
                key,
                value
              );

            }

          }
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "Apps Script ไม่ตอบกลับภายใน 15 วินาที"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        }
        catch(e) {}


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (!response) {

            reject(
              new Error(
                "Apps Script ส่งข้อมูลว่างกลับมา"
              )
            );

            return;

          }


          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "เรียก Apps Script ไม่สำเร็จ"
            )
          );

        };


      script.async =
        true;


      script.src =
        API_URL +
        "?" +
        query.toString();


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   QR SUCCESS
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  if (
    !decodedText ||
    processing
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * กัน QR เดิมยิงซ้ำ
   */

  if (
    decodedText === lastQR &&
    now - lastQRTime < 3000
  ) {

    return;

  }


  lastQR =
    decodedText;


  lastQRTime =
    now;


  processing =
    true;


  updateButtons();


  /*
   * เสียงทันทีเมื่ออ่าน QR สำเร็จ
   */

  beep(true);


  /*
   * หยุดกล้อง
   */

  await stopCamera();


  /*
   * แสดงผลทันที
   */

  resultBox.style.display =
    "block";


  resultBox.className =
    "";


  studentNameBox.textContent =
    "กำลังบันทึกข้อมูล...";


  directionBox.textContent =
    "";


  subjectBox.textContent =
    "";


  timeBox.textContent =
    "";


  durationBox.textContent =
    "";


  rawQRBox.textContent =
    "QR: " +
    decodedText;


  setStatus(
    "⏳ อ่าน QR แล้ว — กำลังบันทึกข้อมูล...",
    "loading"
  );


  try {

    /*
     * ส่งข้อมูลไป Apps Script
     */

    const response =
      await callAppsScript(

        "scan",

        {

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID,

          payload:
            decodedText

        }

      );


    /*
     * ตรวจ success
     */

    if (
      response.success !== true
    ) {

      throw new Error(

        response.error ||
        response.message ||
        "Apps Script ไม่สามารถบันทึกข้อมูลได้"

      );

    }


    /*
     * ชื่อนักเรียน
     */

    studentNameBox.textContent =
      response.fullName ||
      response.studentName ||
      response.studentId ||
      "-";


    /*
     * IN / OUT
     */

    if (
      response.direction ===
      "IN"
    ) {

      directionBox.textContent =
        "🟢 เข้าเรียนสำเร็จ";

    }

    else if (
      response.direction ===
      "OUT"
    ) {

      directionBox.textContent =
        "🔴 ออกจากห้องเรียนสำเร็จ";

    }

    else {

      directionBox.textContent =
        response.direction ||
        "บันทึกสำเร็จ";

    }


    /*
     * วิชา
     */

    subjectBox.textContent =
      "📚 วิชา: " +
      (
        response.subject ||
        "-"
      );


    /*
     * เวลา
     */

    timeBox.textContent =
      "🕐 เวลา: " +
      (
        response.time ||
        "-"
      );


    /*
     * duration
     */

    if (
      response.durationMin !== undefined &&
      response.durationMin !== null &&
      response.durationMin !== ""
    ) {

      durationBox.textContent =
        "⏱ เวลาเรียน: " +
        response.durationMin +
        " นาที";

    }


    /*
     * สำเร็จ
     */

    resultBox.className =
      "success";


    setStatus(

      response.message ||
      "✅ บันทึกข้อมูลสำเร็จ",

      "success"

    );


    beep(true);

  }

  catch(error) {

    console.error(
      "SCAN ERROR:",
      error
    );


    resultBox.className =
      "error";


    studentNameBox.textContent =
      "❌ บันทึกข้อมูลไม่สำเร็จ";


    directionBox.textContent =
      "";


    subjectBox.textContent =
      "";


    timeBox.textContent =
      "";


    durationBox.textContent =
      "";


    rawQRBox.textContent =
      "QR: " +
      decodedText;


    setStatus(

      "❌ " +
      (
        error.message ||
        String(error)
      ),

      "error"

    );


    beep(false);

  }


  processing =
    false;


  updateButtons();

}


/* =========================================================
   SCAN AGAIN
   ========================================================= */

async function scanAgain() {

  if (processing) {
    return;
  }


  resultBox.style.display =
    "none";


  resultBox.className =
    "";


  lastQR =
    "";


  lastQRTime =
    0;


  await startCamera();

}


/* =========================================================
   INITIALIZE
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    /*
     * ไม่ ping Apps Script ตอนเปิดหน้า
     *
     * เพราะตอนนี้เรารู้แล้วว่า Backend ใช้งานได้จริง
     * และการ ping ไม่ควรทำให้หน้ากล้องขึ้น error
     */

    setStatus(
      "พร้อมเปิดกล้อง",
      "info"
    );


    updateButtons();

  }
);


/* =========================================================
   CLOSE PAGE
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      cameraRunning
    ) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>
