<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Kumon QR Scanner</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 15px;

  background: #f3f4f6;

  color: #111827;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


.container {

  max-width: 850px;

  margin: auto;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  text-align: center;

  margin-bottom: 15px;

}


.header h1 {

  margin: 5px 0;

  font-size: 30px;

}


.subtitle {

  color: #6b7280;

  font-size: 16px;

}


/* =====================================================
   CARD
===================================================== */

.card {

  background: white;

  border-radius: 18px;

  padding: 15px;

  margin-bottom: 15px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.07);

}


/* =====================================================
   CAMERA
===================================================== */

.camera-container {

  position: relative;

  width: 100%;

  background: #000;

  border-radius: 15px;

  overflow: hidden;

}


video {

  width: 100%;

  display: block;

  background: #000;

}


.camera-placeholder {

  position: absolute;

  inset: 0;

  display: flex;

  justify-content: center;

  align-items: center;

  color: white;

  font-size: 20px;

  text-align: center;

}


.scan-frame {

  position: absolute;

  width: 60%;

  max-width: 350px;

  aspect-ratio: 1;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  border:
    4px solid white;

  border-radius: 18px;

  pointer-events: none;

  display: none;

}


.scan-frame::before,
.scan-frame::after {

  content: "";

  position: absolute;

  width: 35px;

  height: 35px;

  border-color: #22c55e;

}


.scan-frame::before {

  left: -4px;

  top: -4px;

  border-left: 5px solid;
  border-top: 5px solid;

}


.scan-frame::after {

  right: -4px;

  bottom: -4px;

  border-right: 5px solid;
  border-bottom: 5px solid;

}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {

  display: flex;

  gap: 10px;

  justify-content: center;

  flex-wrap: wrap;

  margin-top: 15px;

}


button {

  border: none;

  border-radius: 12px;

  padding: 13px 22px;

  font-size: 17px;

  font-weight: 700;

  cursor: pointer;

}


button:disabled {

  opacity: .4;

  cursor: not-allowed;

}


.btn-start {

  background: #2563eb;

  color: white;

}


.btn-stop {

  background: #ef4444;

  color: white;

}


.btn-switch {

  background: #6b7280;

  color: white;

}


.btn-continue {

  background: #16a34a;

  color: white;

  width: 100%;

}


.btn-clear {

  background: #e5e7eb;

  color: #374151;

}


/* =====================================================
   STATUS
===================================================== */

.status {

  margin-top: 15px;

  padding: 14px;

  border-radius: 12px;

  text-align: center;

  font-size: 18px;

  font-weight: 700;

  background: #f3f4f6;

}


.status.success {

  background: #dcfce7;

  color: #166534;

}


.status.error {

  background: #fee2e2;

  color: #991b1b;

}


/* =====================================================
   RESULT
===================================================== */

.result {

  display: none;

}


.result.success {

  border:
    3px solid #22c55e;

}


.result-title {

  text-align: center;

  font-size: 26px;

  font-weight: 800;

  color: #166534;

  margin-bottom: 15px;

}


.result-label {

  font-size: 14px;

  color: #6b7280;

  margin-bottom: 5px;

}


.qr-value {

  background: #f9fafb;

  border:
    1px solid #d1d5db;

  border-radius: 10px;

  padding: 15px;

  font-size: 20px;

  font-weight: 700;

  word-break: break-all;

}


.scan-time {

  margin-top: 10px;

  text-align: center;

  color: #6b7280;

  font-size: 14px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
  max-width: 600px
) {

  body {

    padding: 8px;

  }


  .header h1 {

    font-size: 25px;

  }


  button {

    width: 100%;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       HEADER
  ================================================== -->

  <div class="header">

    <h1>
      📷 Kumon QR Scanner
    </h1>

    <div class="subtitle">
      ระบบสแกน QR Attendance
    </div>

  </div>



  <!-- =================================================
       CAMERA
  ================================================== -->

  <div class="card">


    <div class="camera-container">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>


      <div
        id="placeholder"
        class="camera-placeholder"
      >

        📷<br>
        กด "เปิดกล้อง"

      </div>


      <div
        id="scanFrame"
        class="scan-frame"
      ></div>

    </div>



    <!-- BUTTONS -->

    <div class="buttons">


      <button
        id="startBtn"
        class="btn-start"
      >

        📷 เปิดกล้อง

      </button>


      <button
        id="stopBtn"
        class="btn-stop"
        disabled
      >

        ⛔ ปิดกล้อง

      </button>


      <button
        id="switchBtn"
        class="btn-switch"
        disabled
      >

        🔄 สลับกล้อง

      </button>


    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    >

      กล้องยังไม่ได้เปิด

    </div>


  </div>



  <!-- =================================================
       RESULT
  ================================================== -->

  <div
    id="result"
    class="card result"
  >


    <div class="result-title">

      ✅ อ่าน QR สำเร็จ

    </div>


    <div class="result-label">

      ข้อมูล QR Code

    </div>


    <div
      id="qrValue"
      class="qr-value"
    ></div>


    <div
      id="scanTime"
      class="scan-time"
    ></div>


    <div class="buttons">


      <button
        id="continueBtn"
        class="btn-continue"
      >

        🔍 สแกนต่อ

      </button>


      <button
        id="clearBtn"
        class="btn-clear"
      >

        ล้างผลลัพธ์

      </button>


    </div>


  </div>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById(
    "video"
  );


const placeholder =
  document.getElementById(
    "placeholder"
  );


const scanFrame =
  document.getElementById(
    "scanFrame"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const resultBox =
  document.getElementById(
    "result"
  );


const qrValue =
  document.getElementById(
    "qrValue"
  );


const scanTime =
  document.getElementById(
    "scanTime"
  );


const startBtn =
  document.getElementById(
    "startBtn"
  );


const stopBtn =
  document.getElementById(
    "stopBtn"
  );


const switchBtn =
  document.getElementById(
    "switchBtn"
  );


const continueBtn =
  document.getElementById(
    "continueBtn"
  );


const clearBtn =
  document.getElementById(
    "clearBtn"
  );


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let scanning = false;

let cameras = [];

let currentCameraIndex = 0;

let lastQR = "";

let lastQRTime = 0;

let detector = null;


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  type = ""
) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status";

  if (type) {

    statusBox.classList.add(
      type
    );

  }

}


/* =====================================================
   BEEP
===================================================== */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      1000;


    gain.gain.value =
      0.15;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      0.12
    );

  }

  catch (error) {

    console.log(
      "Audio error:",
      error
    );

  }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(
  deviceId = null
) {

  try {

    stopCamera();


    setStatus(
      "กำลังเปิดกล้อง..."
    );


    let constraints;


    if (deviceId) {

      constraints = {

        video: {

          deviceId: {
            exact: deviceId
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };

    }

    else {

      constraints = {

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };

    }


    stream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await video.play();


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    scanFrame.style.display =
      "block";


    scanning =
      true;


    startBtn.disabled =
      true;


    stopBtn.disabled =
      false;


    setStatus(
      "✅ กล้องพร้อม — เล็ง QR ได้เลย",
      "success"
    );


    await loadCameras();


    requestAnimationFrame(
      scanQR
    );

  }

  catch (error) {

    console.error(
      "Camera error:",
      error
    );


    let message =
      "เปิดกล้องไม่สำเร็จ";


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "❌ Browser ไม่อนุญาตให้ใช้กล้อง";

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "❌ ไม่พบกล้อง";

    }

    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "❌ กล้องถูกใช้งานโดยโปรแกรมอื่น";

    }


    setStatus(
      message,
      "error"
    );

  }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

  scanning =
    false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    stream =
      null;

  }


  video.srcObject =
    null;


  video.style.display =
    "none";


  placeholder.style.display =
    "flex";


  scanFrame.style.display =
    "none";


  startBtn.disabled =
    false;


  stopBtn.disabled =
    true;


  switchBtn.disabled =
    true;

}


/* =====================================================
   LOAD CAMERAS
===================================================== */

async function loadCameras() {

  try {

    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    cameras =
      devices.filter(
        device =>
          device.kind ===
          "videoinput"
      );


    console.log(
      "Cameras:",
      cameras
    );


    if (
      cameras.length > 1
    ) {

      switchBtn.disabled =
        false;

    }

  }

  catch (error) {

    console.error(
      error
    );

  }

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera() {

  if (
    cameras.length < 2
  ) {

    return;

  }


  currentCameraIndex++;


  if (
    currentCameraIndex >=
    cameras.length
  ) {

    currentCameraIndex =
      0;

  }


  const camera =
    cameras[
      currentCameraIndex
    ];


  setStatus(
    "กำลังสลับกล้อง..."
  );


  await startCamera(
    camera.deviceId
  );

}


/* =====================================================
   QR SCAN LOOP
===================================================== */

function scanQR() {

  if (!scanning) {

    return;

  }


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    if (
      "BarcodeDetector"
      in window
    ) {

      detectQR();

    }

  }


  requestAnimationFrame(
    scanQR
  );

}


/* =====================================================
   DETECT QR
===================================================== */

async function detectQR() {

  if (!detector) {

    try {

      detector =
        new BarcodeDetector({

          formats: [
            "qr_code"
          ]

        });

    }

    catch (error) {

      console.error(
        "BarcodeDetector not supported",
        error
      );

      setStatus(
        "Browser ไม่รองรับ QR Scanner",
        "error"
      );

      scanning =
        false;

      return;

    }

  }


  try {

    const results =
      await detector.detect(
        video
      );


    if (
      results &&
      results.length > 0
    ) {

      const value =
        results[0].rawValue;


      handleQR(
        value
      );

    }

  }

  catch (error) {

    console.log(
      "QR detection error:",
      error
    );

  }

}


/* =====================================================
   QR FOUND
===================================================== */

function handleQR(
  value
) {

  if (!value) {

    return;

  }


  const now =
    Date.now();


  /*
   * ป้องกัน QR เดิมซ้ำ
   */

  if (

    value === lastQR &&

    now - lastQRTime < 3000

  ) {

    return;

  }


  lastQR =
    value;


  lastQRTime =
    now;


  console.log(
    "QR FOUND:",
    value
  );


  /*
   * หยุดการ Scan
   */

  scanning =
    false;


  /*
   * เสียง
   */

  beep();


  /*
   * แสดงข้อมูล
   */

  qrValue.textContent =
    value;


  const date =
    new Date();


  scanTime.textContent =
    "เวลาอ่าน: " +
    date.toLocaleTimeString(
      "th-TH"
    );


  resultBox.style.display =
    "block";


  resultBox.classList.add(
    "success"
  );


  /*
   * สถานะ
   */

  setStatus(
    "✅ อ่าน QR สำเร็จ",
    "success"
  );


  /*
   * หยุดกล้องจริง
   */

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    stream =
      null;

  }


  video.srcObject =
    null;


  video.style.display =
    "none";


  scanFrame.style.display =
    "none";


  startBtn.disabled =
    true;


  stopBtn.disabled =
    true;


  switchBtn.disabled =
    true;

}


/* =====================================================
   SCAN AGAIN
===================================================== */

continueBtn.addEventListener(

  "click",

  async function() {

    resultBox.style.display =
      "none";


    resultBox.classList.remove(
      "success"
    );


    lastQR =
      "";


    setStatus(
      "พร้อมสแกน QR"
    );


    await startCamera();

  }

);


/* =====================================================
   CLEAR RESULT
===================================================== */

clearBtn.addEventListener(

  "click",

  function() {

    qrValue.textContent =
      "";


    scanTime.textContent =
      "";


    resultBox.style.display =
      "none";


    resultBox.classList.remove(
      "success"
    );

  }

);


/* =====================================================
   BUTTONS
===================================================== */

startBtn.addEventListener(

  "click",

  function() {

    startCamera();

  }

);


stopBtn.addEventListener(

  "click",

  function() {

    stopCamera();


    setStatus(
      "กล้อง: ปิดแล้ว"
    );

  }

);


switchBtn.addEventListener(

  "click",

  function() {

    switchCamera();

  }

);


/* =====================================================
   CHECK CAMERA API
===================================================== */

window.addEventListener(

  "load",

  function() {

    if (

      !navigator.mediaDevices ||

      !navigator.mediaDevices
        .getUserMedia

    ) {

      setStatus(
        "❌ Browser นี้ไม่รองรับ Camera API",
        "error"
      );


      startBtn.disabled =
        true;

    }

  }

);

</script>

</body>
</html>
