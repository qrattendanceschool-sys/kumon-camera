      transform:

      width: min(280px, 65vw);

      height: min(280px, 65vw);

        3px solid rgba(255,255,255,.95);

      border-radius: 18px;

      pointer-events: none;

      z-index: 10;

    .scan-line {
      position: absolute;

      left: 18px;

      right: 18px;

      top: 50%;

      height: 2px;

      background: #ef4444;

      box-shadow:
        0 0 8px rgba(239,68,68,.7);
    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {
      padding: 15px;

      border-radius: 12px;

      text-align: center;

      font-size: 18px;

      font-weight: 800;

      background: #f3f4f6;

      margin-bottom: 16px;
    }


    .status.success {
      background: #dcfce7;

      color: #166534;
    }


    .status.error {
      background: #fee2e2;

      color: #991b1b;
    }


    .status.loading {
      background: #fef3c7;

      color: #92400e;
    }


    .status.info {
      background: #dbeafe;

      color: #1e40af;
    }


    /* =====================================================
       RESULT
       ===================================================== */

    .result {
      display: none;

      padding: 20px;

      border-radius: 14px;

      background: #f8fafc;

      border:
        1px solid #e5e7eb;
    }


    .result.success-result {
      border-color: #86efac;

    }


    .result.error-result {

    }


    .name {
      font-size: 27px;

      font-weight: 900;

      margin-bottom: 10px;

      word-break: break-word;
    }


    .direction {

      font-weight: 900;

    }


    .line {

    }


    .raw {
      margin-top: 14px;

      border-radius: 9px;

      background: #e5e7eb;

      word-break: break-all;

      font-size: 13px;

      color: #4b5563;
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .buttons {
      display: grid;

      grid-template-columns:

    button {
      border: 0;

    button:disabled {

    .start {

    }

    }


    .switch {

    .again {

    /* =====================================================

      }

      }

<script>


/* =========================================================
   CONFIG
   ========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec';


const BRANCH_ID =
  'B001';


const DEVICE_ID =
  'B001-01';


/* =========================================================
   GLOBAL
   ========================================================= */

let scanner = null;

let cameras = [];

let currentCameraIndex = 0;

let scanning = false;

let processing = false;

let lastQR = '';

let lastQRTime = 0;


/* =========================================================
   ELEMENTS
   ========================================================= */

const readerBox =
  document.getElementById(
    'reader'
  );


const statusBox =
  document.getElementById(
    'status'
  );


const resultBox =
  document.getElementById(
    'result'
  );


const studentName =
  document.getElementById(
    'studentName'
  );


const directionBox =
  document.getElementById(
    'direction'
  );


const subjectBox =
  document.getElementById(
    'subject'
  );


const timeBox =
  document.getElementById(
    'time'
  );


const durationBox =
  document.getElementById(
    'duration'
  );


const rawBox =
  document.getElementById(
    'raw'
  );


const scanFrame =
  document.getElementById(
    'scanFrame'
  );


const startButton =
  document.getElementById(
    'startButton'
  );


const stopButton =
  document.getElementById(
    'stopButton'
  );


const switchButton =
  document.getElementById(
    'switchButton'
  );


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  text,
  type = 'info'
) {

  statusBox.textContent =
    text;

  statusBox.className =
    'status ' + type;

}


/* =========================================================
   SOUND
   ========================================================= */

function beep(
  success = true
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      success
        ? 1000
        : 450;


    gain.gain.value =
      0.15;


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      0.12
    );


  } catch (error) {

    console.log(
      'beep error:',
      error
    );

  }

}


/* =========================================================
   BUTTON STATE
   ========================================================= */

function updateButtons() {

  startButton.disabled =
    scanning ||
    processing;


  stopButton.disabled =
    !scanning;


  switchButton.disabled =
    !scanning ||
    cameras.length < 2;

}


/* =========================================================
   CLEAR CAMERA UI
   ========================================================= */

function clearCameraUI() {

  scanFrame.style.display =
    'none';


  if (!scanning) {

    readerBox.innerHTML =
      `
      <div
        class="camera-placeholder"
      >
        📷 กด "เปิดกล้อง"
        เพื่อเริ่มสแกน
      </div>
      `;

  }

}


/* =========================================================
   CHECK LIBRARY
   ========================================================= */

function checkScannerLibrary() {

  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    throw new Error(
      'ไม่พบระบบสแกน QR (html5-qrcode)'
    );

  }

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startScanner() {

  if (
    scanning ||
    processing
  ) {

    return;

  }


  try {

    checkScannerLibrary();


    setStatus(
      '⏳ กำลังขออนุญาตใช้กล้อง...',
      'loading'
    );


    /*
     * สร้าง scanner ใหม่
     */

    if (!scanner) {

      readerBox.innerHTML =
        '';

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }


    /*
     * วิธีหลัก:
     * ขอใช้กล้องหลังโดยตรง
     *
     * วิธีนี้ช่วยลดปัญหา
     * iPad เลือกกล้องผิดตัว
     */

    try {

      await scanner.start(

        {
          facingMode:
            {
              exact:
                'environment'
            }
        },

        {

          fps: 10,

          qrbox:
            function(
              width,
              height
            ) {

              const size =
                Math.floor(
                  Math.min(
                    width,
                    height
                  ) * 0.65
                );

              return {

                width:
                  Math.min(
                    size,
                    320
                  ),

                height:
                  Math.min(
                    size,
                    320
                  )

              };

            }

        },

        onScanSuccess,

        function() {}

      );


    } catch (
      environmentError
    ) {

      /*
       * Fallback:
       * ถ้า environment ไม่ได้
       * ให้ค้นหากล้องทั้งหมด
       */

      console.log(
        'Environment camera failed:',
        environmentError
      );


      cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          'ไม่พบกล้องในอุปกรณ์'
        );

      }


      /*
       * หาตัวที่เป็นกล้องหลัง
       */

      let backIndex =
        cameras.findIndex(
          camera =>
            /back|rear|environment/i.test(
              camera.label || ''
            )
        );


      if (backIndex < 0) {

        backIndex = 0;

      }


      currentCameraIndex =
        backIndex;


      const cameraId =
        cameras[
          currentCameraIndex
        ].id;


      await scanner.start(

        cameraId,

        {

          fps: 10,

          qrbox:
            function(
              width,
              height
            ) {

              const size =
                Math.floor(
                  Math.min(
                    width,
                    height
                  ) * 0.65
                );

              return {

                width:
                  Math.min(
                    size,
                    320
                  ),

                height:
                  Math.min(
                    size,
                    320
                  )

              };

            }

        },

        onScanSuccess,

        function() {}

      );

    }


    scanning = true;


    scanFrame.style.display =
      'block';


    setStatus(
      '🟢 พร้อมสแกน QR',
      'success'
    );


    updateButtons();


  } catch (error) {

    console.error(
      'START CAMERA ERROR:',
      error
    );


    scanning = false;


    scanFrame.style.display =
      'none';


    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    if (
      error &&
      error.name ===
      'NotAllowedError'
    ) {

      message =
        'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณากด Allow Camera ใน Browser';

    }


    else if (
      error &&
      error.name ===
      'NotFoundError'
    ) {

      message =
        'ไม่พบกล้องในอุปกรณ์';

    }


    else if (
      error &&
      error.name ===
      'NotReadableError'
    ) {

      message =
        'กล้องกำลังถูกใช้งานโดยแอปหรือเว็บไซต์อื่น';

    }


    else if (
      error &&
      error.name ===
      'SecurityError'
    ) {

      message =
        'Browser ไม่อนุญาตให้ใช้กล้อง กรุณาเปิดเว็บไซต์ผ่าน HTTPS';

    }


    setStatus(
      '❌ เปิดกล้องไม่สำเร็จ: ' +
      message,
      'error'
    );


    updateButtons();

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

async function stopScanner() {

  if (!scanner) {

    scanning = false;

    updateButtons();

    return;

  }


  try {

    if (scanning) {

      await scanner.stop();

    }


  } catch (error) {

    console.log(
      'stop error:',
      error
    );


  } finally {

    scanning = false;


    scanFrame.style.display =
      'none';


    /*
     * ไม่ clear scanner object
     * เพื่อให้สามารถเริ่มใหม่ได้
     */

    readerBox.innerHTML =
      `
      <div
        class="camera-placeholder"
      >
        📷 กด "เปิดกล้อง"
        เพื่อเริ่มสแกน
      </div>
      `;


    updateButtons();

  }

}


/* =========================================================
   SWITCH CAMERA
   ========================================================= */

async function switchCamera() {

  if (
    processing ||
    !cameras ||
    cameras.length < 2
  ) {

    /*
     * ถ้ายังไม่มีรายการกล้อง
     * ให้ค้นหาก่อน
     */

    try {

      cameras =
        await Html5Qrcode
          .getCameras();

    } catch (error) {

      setStatus(
        '❌ ไม่สามารถค้นหากล้องได้',
        'error'
      );

      return;

    }

  }


  if (
    cameras.length < 2
  ) {

    setStatus(
      'มีเพียงกล้องเดียวในอุปกรณ์',
      'info'
    );

    return;

  }


  try {

    await stopScanner();


    currentCameraIndex =
      (
        currentCameraIndex + 1
      ) %
      cameras.length;


    readerBox.innerHTML =
      '';


    if (!scanner) {

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }


    const cameraId =
      cameras[
        currentCameraIndex
      ].id;


    setStatus(
      '⏳ กำลังสลับกล้อง...',
      'loading'
    );


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * 0.65
              );

            return {

              width:
                Math.min(
                  size,
                  320
                ),

              height:
                Math.min(
                  size,
                  320
                )

            };

          }

      },

      onScanSuccess,

      function() {}

    );


    scanning = true;


    scanFrame.style.display =
      'block';


    setStatus(
      '🟢 พร้อมสแกน QR',
      'success'
    );


    updateButtons();


  } catch (error) {

    console.error(
      'SWITCH CAMERA ERROR:',
      error
    );


    scanning = false;


    setStatus(
      '❌ สลับกล้องไม่สำเร็จ: ' +
      (
        error.message ||
        error
      ),
      'error'
    );


    updateButtons();

  }

}


/* =========================================================
   JSONP API
   ========================================================= */

function callAPI(
  action,
  params = {}
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callbackName =
        'attendanceCallback_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object.keys(params)
        .forEach(
          key => {

            const value =
              params[key];


            if (
              value !== undefined &&
              value !== null
            ) {

              query.set(
                key,
                String(value)
              );

            }

          }
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                'Apps Script ไม่ตอบกลับภายใน 15 วินาที'
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (error) {}


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          if (
            !response
          ) {

            reject(
              new Error(
                'Apps Script ไม่ส่งข้อมูลกลับมา'
              )
            );

            return;

          }


          if (
            response.success !== true
          ) {

            reject(
              new Error(
                response.error ||
                response.message ||
                'Apps Script ไม่สามารถบันทึกข้อมูลได้'
              )
            );

            return;

          }


          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          reject(
            new Error(
              'เชื่อมต่อ Apps Script ไม่สำเร็จ'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        query.toString();


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   QR SUCCESS
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  if (
    processing ||
    !decodedText
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * ป้องกัน QR เดิม
   * ถูกอ่านซ้ำ
   */

  if (
    decodedText === lastQR &&
    now - lastQRTime < 3000
  ) {

    return;

  }


  lastQR =
    decodedText;


  lastQRTime =
    now;


  processing = true;


  updateButtons();


  /*
   * หยุดกล้อง
   */

  await stopScanner();


  /*
   * แสดงผลทันทีว่าอ่าน QR แล้ว
   */

  resultBox.style.display =
    'block';


  resultBox.className =
    'result';


  setStatus(
    '⏳ อ่าน QR แล้ว — กำลังบันทึกข้อมูล...',
    'loading'
  );


  rawBox.textContent =
    'QR: ' +
    decodedText;


  studentName.textContent =
    'กำลังตรวจสอบ...';


  directionBox.textContent =
    '';


  subjectBox.textContent =
    '';


  timeBox.textContent =
    '';


  durationBox.textContent =
    '';


  /*
   * เสียงอ่าน QR
   */

  beep(true);


  try {


    /*
     * ส่ง QR ไป Apps Script
     */

    const response =
      await callAPI(
        'scan',
        {

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID,

          payload:
            decodedText

        }
      );


    /*
     * สำคัญ:
     * Apps Script ของเรา
     * ส่งข้อมูลกลับมาโดยตรง
     */

    const data =
      response;


    if (!data) {

      throw new Error(
        'Apps Script ไม่ส่งข้อมูลกลับมา'
      );

    }


    /*
     * ชื่อนักเรียน
     */

    studentName.textContent =
      data.fullName ||
      data.studentName ||
      data.studentId ||
      '-';


    /*
     * IN / OUT
     */

    if (
      data.direction ===
      'IN'
    ) {

      directionBox.textContent =
        '🟢 CHECK-IN';

    }

    else if (
      data.direction ===
      'OUT'
    ) {

      directionBox.textContent =
        '🔴 CHECK-OUT';

    }

    else {

      directionBox.textContent =
        data.direction ||
        '';

    }


    /*
     * วิชา
     */

    subjectBox.textContent =
      'วิชา: ' +
      (
        data.subject ||
        '-'
      );


    /*
     * เวลา
     */

    timeBox.textContent =
      'เวลา: ' +
      (
        data.time ||
        '-'
      );


    /*
     * เวลาเรียน
     */

    if (
      data.durationMin !== '' &&
      data.durationMin !== null &&
      data.durationMin !== undefined
    ) {

      durationBox.textContent =
        'เวลาเรียน: ' +
        data.durationMin +
        ' นาที';

    }


    /*
     * สำเร็จ
     */

    resultBox.className =
      'result success-result';


    setStatus(
      data.message ||
      (
        data.direction ===
        'IN'

          ? '✅ เช็กอินสำเร็จ'

          : data.direction ===
            'OUT'

            ? '✅ เช็กเอาต์สำเร็จ'

            : '✅ บันทึกข้อมูลสำเร็จ'
      ),
      'success'
    );


    beep(true);


  } catch (error) {

    console.error(
      'SCAN ERROR:',
      error
    );


    resultBox.className =
      'result error-result';


    studentName.textContent =
      'ไม่สามารถบันทึกข้อมูลได้';


    directionBox.textContent =
      '';


    subjectBox.textContent =
      '';


    timeBox.textContent =
      '';


    durationBox.textContent =
      '';


    rawBox.textContent =
      'QR: ' +
      decodedText;


    setStatus(
      '❌ ' +
      (
        error.message ||
        error
      ),
      'error'
    );


    beep(false);

  }


  processing = false;


  updateButtons();

}


/* =========================================================
   SCAN AGAIN
   ========================================================= */

async function scanAgain() {

  if (processing) {
    return;
  }


  resultBox.style.display =
    'none';


  resultBox.className =
    'result';


  lastQR = '';

  lastQRTime = 0;


  /*
   * ถ้ามี scanner เดิม
   * ให้ใช้ต่อ
   */

  try {

    await startScanner();

  } catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  'load',
  function() {

    /*
     * เช็ก library ตั้งแต่เริ่ม
     * แต่ไม่ขอใช้กล้องจนกว่าผู้ใช้กดปุ่ม
     */

    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      setStatus(
        '❌ โหลดระบบกล้องไม่สำเร็จ',
        'error'
      );

      return;

    }


    setStatus(
      'พร้อมเปิดกล้อง',
      'info'
    );


    updateButtons();

  }
);


/* =========================================================
   PAGE LEAVE
   ========================================================= */

window.addEventListener(
  'beforeunload',
  function() {

    if (
      scanner &&
      scanning
    ) {

      scanner.stop()
        .catch(
          () => {}
        );

    }

  }
);

</script>
