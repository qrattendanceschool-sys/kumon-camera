<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Kumon Central Korat - QR Attendance</title>

<!-- QR SCANNER -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #f4f6fa;
  color: #111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* ================= HEADER ================= */

.header {
  background: white;
  border-radius: 22px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 5px 18px rgba(0,0,0,.07);
  margin-bottom: 18px;
}

.title {
  font-size: 34px;
  font-weight: 900;
}

.subtitle {
  margin-top: 8px;
  font-size: 22px;
  color: #6b7280;
  font-weight: 700;
}

.branch {
  margin-top: 10px;
  font-size: 18px;
  font-weight: 800;
  color: #374151;
}

/* ================= CAMERA ================= */

.camera-card {
  background: white;
  padding: 16px;
  border-radius: 22px;
  box-shadow: 0 5px 18px rgba(0,0,0,.07);
  margin-bottom: 16px;
}

#reader {
  width: 100%;
  min-height: 450px;
  background: #101827;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  display: block;
  border-radius: 18px;
  object-fit: cover;
}

#placeholder {
  min-height: 450px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #d1d5db;
  font-size: 23px;
  font-weight: 800;
  padding: 30px;
}

/* QR FRAME */

#scanFrame {
  display: none;
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: min(340px, 65vw);
  height: min(340px, 65vw);

  border: 3px solid white;
  border-radius: 20px;

  pointer-events: none;

  z-index: 20;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,.10);
}

#scanLine {
  position: absolute;
  left: 15px;
  right: 15px;
  top: 50%;
  height: 3px;
  background: red;
}

/* ================= STATUS ================= */

.status {
  padding: 18px;
  border-radius: 16px;
  text-align: center;
  font-size: 21px;
  font-weight: 900;
  margin-bottom: 16px;
}

.info {
  background: #e0e7ff;
  color: #3730a3;
}

.loading {
  background: #fef3c7;
  color: #92400e;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

/* ================= RESULT ================= */

#result {
  display: none;

  background: white;

  border-radius: 22px;

  padding: 24px;

  margin-bottom: 16px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.07);
}

.success-result {
  border: 2px solid #86efac;
  background: #f0fdf4 !important;
}

.error-result {
  border: 2px solid #fca5a5;
  background: #fef2f2 !important;
}

#studentName {
  font-size: 36px;
  font-weight: 900;
  margin-bottom: 10px;
}

#direction {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 14px;
}

.result-line {
  font-size: 20px;
  font-weight: 700;
  margin: 9px 0;
}

#rawQR {
  margin-top: 18px;
  padding: 13px;
  background: #e5e7eb;
  border-radius: 10px;
  font-size: 14px;
  word-break: break-all;
}

/* ================= BUTTONS ================= */

.controls {
  background: white;
  border-radius: 22px;
  padding: 16px;

  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap: 12px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.07);
}

button {
  border: none;
  border-radius: 14px;

  min-height: 68px;

  font-size: 20px;
  font-weight: 900;

  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#startButton {
  background: #2563eb;
  color: white;
}

#stopButton {
  background: #ef4444;
  color: white;
}

#switchButton {
  background: #6b7280;
  color: white;
}

#againButton {
  width: 100%;
  margin-top: 18px;

  background: #16a34a;
  color: white;
}

/* ================= MOBILE ================= */

@media (max-width: 650px) {

  body {
    padding: 10px;
  }

  .title {
    font-size: 26px;
  }

  .subtitle {
    font-size: 18px;
  }

  .branch {
    font-size: 14px;
  }

  #reader,
  #placeholder {
    min-height: 340px;
  }

  #placeholder {
    font-size: 19px;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  #studentName {
    font-size: 28px;
  }

  #direction {
    font-size: 24px;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

  <div class="title">
    📷 Kumon Central Korat
  </div>

  <div class="subtitle">
    สแกน QR เข้า–ออก
  </div>

  <div class="branch">
    Branch: B001 | สาขาหลัก | Device: B001-01
  </div>

</div>


<!-- =====================================================
     CAMERA
===================================================== -->

<div class="camera-card">

  <div id="reader">

    <div id="placeholder">
      📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน
    </div>

    <div id="scanFrame">
      <div id="scanLine"></div>
    </div>

  </div>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
  id="status"
  class="status info"
>
  กำลังตรวจสอบการเชื่อมต่อ...
</div>


<!-- =====================================================
     RESULT
===================================================== -->

<div id="result">

  <div id="studentName">
    -
  </div>

  <div id="direction"></div>

  <div
    id="subject"
    class="result-line"
  ></div>

  <div
    id="time"
    class="result-line"
  ></div>

  <div
    id="duration"
    class="result-line"
  ></div>

  <div id="rawQR"></div>

  <button
    id="againButton"
    onclick="scanAgain()"
  >
    🔍 สแกนคนถัดไป
  </button>

</div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

  <button
    id="startButton"
    onclick="startCamera()"
  >
    📷 เปิดกล้อง
  </button>

  <button
    id="stopButton"
    onclick="stopCamera()"
    disabled
  >
    ⛔ ปิดกล้อง
  </button>

  <button
    id="switchButton"
    onclick="switchCamera()"
    disabled
  >
    🔄 สลับกล้อง
  </button>

</div>


</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec";

const BRANCH_ID =
  "B001";

const DEVICE_ID =
  "B001-01";


/* =========================================================
   GLOBAL STATE
========================================================= */

let scanner = null;

let cameras = [];

let currentCameraIndex = 0;

let cameraRunning = false;

let cameraBusy = false;

let processing = false;

let scanLocked = false;

let lastQR = "";

let lastQRTime = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const studentNameBox =
  document.getElementById("studentName");

const directionBox =
  document.getElementById("direction");

const subjectBox =
  document.getElementById("subject");

const timeBox =
  document.getElementById("time");

const durationBox =
  document.getElementById("duration");

const rawQRBox =
  document.getElementById("rawQR");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const switchButton =
  document.getElementById("switchButton");

const placeholder =
  document.getElementById("placeholder");

const scanFrame =
  document.getElementById("scanFrame");


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  type = "info"
) {

  statusBox.textContent =
    text;

  statusBox.className =
    "status " + type;

}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons() {

  startButton.disabled =
    cameraRunning ||
    cameraBusy ||
    processing;

  stopButton.disabled =
    !cameraRunning ||
    cameraBusy;

  switchButton.disabled =
    !cameraRunning ||
    cameraBusy ||
    cameras.length < 2;

}


/* =========================================================
   BEEP
========================================================= */

function beep(
  success = true
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );

    oscillator.frequency.value =
      success ? 1000 : 400;

    gain.gain.value =
      0.15;

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.15
    );

  }

  catch(e) {

    console.log(e);

  }

}


/* =========================================================
   CREATE SCANNER
========================================================= */

function createScanner() {

  if (scanner) {
    return;
  }

  scanner =
    new Html5Qrcode(
      "reader"
    );

}


/* =========================================================
   CAMERA CONFIG
========================================================= */

function getScannerConfig() {

  return {

    fps: 10,

    qrbox:
      function(width, height) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.65
          );

        return {

          width:
            Math.min(
              size,
              320
            ),

          height:
            Math.min(
              size,
              320
            )

        };

      },

    aspectRatio: 1.0

  };

}


/* =========================================================
   GET CAMERA LIST
========================================================= */

async function getCameraList() {

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    throw new Error(
      "ระบบอ่าน QR Code โหลดไม่สำเร็จ"
    );

  }


  const list =
    await Html5Qrcode.getCameras();


  if (
    !list ||
    list.length === 0
  ) {

    throw new Error(
      "ไม่พบกล้องในอุปกรณ์"
    );

  }


  cameras =
    list;


  console.log(
    "AVAILABLE CAMERAS:",
    cameras
  );


  return cameras;

}


/* =========================================================
   FIND REAR CAMERA
========================================================= */

function findRearCamera(
  list
) {

  if (
    !list ||
    list.length === 0
  ) {

    return 0;

  }


  const index =
    list.findIndex(
      camera =>
        /back|rear|environment|หลัง/i
          .test(
            camera.label || ""
          )
    );


  if (index >= 0) {

    return index;

  }


  /*
   * iPad บางรุ่นไม่ส่งชื่อกล้อง
   * จึงใช้กล้องตัวสุดท้าย
   */

  return list.length - 1;

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

  if (
    cameraBusy ||
    cameraRunning ||
    processing
  ) {

    return;

  }


  cameraBusy =
    true;

  updateButtons();


  try {

    setStatus(
      "⏳ กำลังเปิดกล้อง...",
      "loading"
    );


    createScanner();


    /*
     * ขอ permission
     * และรับรายการกล้อง
     */

    await getCameraList();


    currentCameraIndex =
      findRearCamera(
        cameras
      );


    const cameraId =
      cameras[
        currentCameraIndex
      ].id;


    console.log(
      "START CAMERA ID:",
      cameraId
    );


    /*
     * START เพียงครั้งเดียว
     */

    await scanner.start(

      cameraId,

      getScannerConfig(),

      onScanSuccess,

      function(errorMessage) {

        /*
         * html5-qrcode จะเรียก callback นี้
         * ทุกครั้งที่ยังอ่าน QR ไม่ได้
         *
         * ไม่ต้องแสดงบนหน้าจอ
         */

        console.log(
          "QR:",
          errorMessage
        );

      }

    );


    cameraRunning =
      true;

    scanLocked =
      false;


    placeholder.style.display =
      "none";

    scanFrame.style.display =
      "block";


    setStatus(
      "🟢 พร้อมสแกน QR",
      "success"
    );


  }

  catch(error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    cameraRunning =
      false;


    scanFrame.style.display =
      "none";


    placeholder.style.display =
      "flex";


    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    if (
      /NotAllowedError/i
        .test(message)
    ) {

      message =
        "กรุณาอนุญาตการใช้กล้อง";

    }


    setStatus(
      "❌ เปิดกล้องไม่สำเร็จ: " +
      message,
      "error"
    );

  }

  finally {

    cameraBusy =
      false;

    updateButtons();

  }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function stopCamera() {

  if (
    cameraBusy ||
    !cameraRunning ||
    !scanner
  ) {

    return;

  }


  cameraBusy =
    true;

  updateButtons();


  try {

    scanLocked =
      true;


    setStatus(
      "⏳ กำลังปิดกล้อง...",
      "loading"
    );


    await scanner.stop();


  }

  catch(error) {

    console.log(
      "STOP ERROR:",
      error
    );

  }


  cameraRunning =
    false;


  scanFrame.style.display =
    "none";


  placeholder.style.display =
    "flex";


  setStatus(
    "พร้อมเปิดกล้อง",
    "info"
  );


  cameraBusy =
    false;

  updateButtons();

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera() {

  if (
    cameraBusy ||
    !cameraRunning ||
    processing
  ) {

    return;

  }


  if (
    cameras.length < 2
  ) {

    setStatus(
      "ไม่พบกล้องตัวที่สอง",
      "error"
    );

    return;

  }


  cameraBusy =
    true;

  updateButtons();


  try {

    scanLocked =
      true;


    setStatus(
      "⏳ กำลังสลับกล้อง...",
      "loading"
    );


    /*
     * STOP ตัวเดิมก่อน
     */

    await scanner.stop();


    cameraRunning =
      false;


    /*
     * เลือกตัวถัดไป
     */

    currentCameraIndex =
      (
        currentCameraIndex + 1
      ) %
      cameras.length;


    const cameraId =
      cameras[
        currentCameraIndex
      ].id;


    /*
     * START ตัวใหม่
     */

    await scanner.start(

      cameraId,

      getScannerConfig(),

      onScanSuccess,

      function(errorMessage) {

        console.log(
          "QR:",
          errorMessage
        );

      }

    );


    cameraRunning =
      true;

    scanLocked =
      false;


    scanFrame.style.display =
      "block";


    setStatus(
      "🟢 สลับกล้องสำเร็จ",
      "success"
    );

  }

  catch(error) {

    console.error(
      "SWITCH ERROR:",
      error
    );


    cameraRunning =
      false;

    scanLocked =
      true;


    scanFrame.style.display =
      "none";


    setStatus(
      "❌ สลับกล้องไม่สำเร็จ: " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }

  finally {

    cameraBusy =
      false;

    updateButtons();

  }

}


/* =========================================================
   APPS SCRIPT JSONP
========================================================= */

function callAppsScript(
  action,
  params = {}
) {

  return new Promise(
    function(resolve, reject) {

      /*
       * ชื่อ callback ต้องไม่ซ้ำ
       */

      const callbackName =
        "__kumonCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams();


      query.set(
        "action",
        action
      );


      query.set(
        "callback",
        callbackName
      );


      Object.keys(params)
        .forEach(
          function(key) {

            const value =
              params[key];


            if (
              value !== undefined &&
              value !== null
            ) {

              query.set(
                key,
                String(value)
              );

            }

          }
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "Apps Script ไม่ตอบกลับภายใน 15 วินาที"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        }

        catch(e) {}


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      /*
       * JSONP callback
       */

      window[
        callbackName
      ] =
        function(data) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          console.log(
            "APPS SCRIPT RESPONSE:",
            data
          );


          resolve(
            data
          );

        };


      /*
       * Script โหลดไม่ได้
       */

      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "เรียก Apps Script ไม่สำเร็จ"
            )
          );

        };


      script.async =
        true;


      /*
       * สำคัญ:
       *
       * URLSearchParams จะ encode
       * 18040#MATH เป็น
       * 18040%23MATH
       *
       * ทำให้ # ไม่ตัด URL
       */

      script.src =
        API_URL +
        "?" +
        query.toString();


      console.log(
        "APPS SCRIPT URL:",
        script.src
      );


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   QR SUCCESS
========================================================= */

async function onScanSuccess(
  decodedText
) {

  if (
    !decodedText ||
    scanLocked ||
    processing ||
    cameraBusy
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * กัน QR เดิมถูกอ่านซ้ำ
   */

  if (
    decodedText === lastQR &&
    now - lastQRTime < 3000
  ) {

    return;

  }


  lastQR =
    decodedText;

  lastQRTime =
    now;


  processing =
    true;

  scanLocked =
    true;


  updateButtons();


  beep(true);


  /*
   * =====================================================
   * หยุดกล้องก่อนบันทึก
   * =====================================================
   */

  if (
    scanner &&
    cameraRunning
  ) {

    cameraBusy =
      true;

    updateButtons();


    try {

      await scanner.stop();

    }

    catch(error) {

      console.log(
        "STOP AFTER SCAN:",
        error
      );

    }


    cameraRunning =
      false;

    cameraBusy =
      false;

  }


  scanFrame.style.display =
    "none";


  /*
   * =====================================================
   * RESULT
   * =====================================================
   */

  resultBox.style.display =
    "block";


  resultBox.className = "";


  studentNameBox.textContent =
    "กำลังบันทึกข้อมูล...";


  directionBox.textContent =
    "";


  subjectBox.textContent =
    "";


  timeBox.textContent =
    "";


  durationBox.textContent =
    "";


  rawQRBox.textContent =
    "QR: " +
    decodedText;


  setStatus(
    "⏳ อ่าน QR สำเร็จ กำลังบันทึก...",
    "loading"
  );


  try {

    /*
     * ส่ง Apps Script
     */

    const response =
      await callAppsScript(

        "scan",

        {

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID,

          payload:
            decodedText

        }

      );


    console.log(
      "SCAN RESPONSE:",
      response
    );


    /*
     * ตรวจผลลัพธ์
     */

    if (
      !response ||
      response.success !== true
    ) {

      throw new Error(

        response &&
        (
          response.error ||
          response.message
        )

          ? (
              response.error ||
              response.message
            )

          : "Apps Script ไม่สามารถบันทึกข้อมูลได้"

      );

    }


    /*
     * =================================================
     * SUCCESS
     * =================================================
     */

    studentNameBox.textContent =
      response.fullName ||
      response.studentName ||
      response.studentId ||
      "-";


    if (
      response.direction ===
      "IN"
    ) {

      directionBox.textContent =
        "🟢 เข้าเรียนสำเร็จ";

    }

    else if (
      response.direction ===
      "OUT"
    ) {

      directionBox.textContent =
        "🔴 ออกจากห้องเรียนสำเร็จ";

    }

    else {

      directionBox.textContent =
        response.direction ||
        "บันทึกสำเร็จ";

    }


    subjectBox.textContent =
      "📚 วิชา: " +
      (
        response.subject ||
        "-"
      );


    timeBox.textContent =
      "🕐 เวลา: " +
      (
        response.time ||
        "-"
      );


    if (
      response.durationMin !== undefined &&
      response.durationMin !== null &&
      response.durationMin !== ""
    ) {

      durationBox.textContent =
        "⏱ เวลาเรียน: " +
        response.durationMin +
        " นาที";

    }


    resultBox.className =
      "success-result";


    setStatus(
      response.message ||
      "✅ บันทึกข้อมูลสำเร็จ",
      "success"
    );


    beep(true);

  }

  catch(error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    resultBox.className =
      "error-result";


    studentNameBox.textContent =
      "❌ บันทึกข้อมูลไม่สำเร็จ";


    directionBox.textContent =
      "";


    setStatus(
      "❌ " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );


    beep(false);

  }


  processing =
    false;

  scanLocked =
    true;


  updateButtons();

}


/* =========================================================
   SCAN AGAIN
========================================================= */

async function scanAgain() {

  if (
    processing ||
    cameraBusy
  ) {

    return;

  }


  resultBox.style.display =
    "none";


  resultBox.className = "";


  lastQR =
    "";

  lastQRTime =
    0;


  scanLocked =
    false;


  setStatus(
    "⏳ กำลังเปิดกล้อง...",
    "loading"
  );


  /*
   * เปิดกล้องใหม่
   */

  await startCamera();

}


/* =========================================================
   TEST APPS SCRIPT
========================================================= */

async function testBackend() {

  try {

    setStatus(
      "⏳ กำลังเชื่อมต่อ Apps Script...",
      "loading"
    );


    const result =
      await callAppsScript(
        "ping"
      );


    console.log(
      "PING:",
      result
    );


    if (
      result &&
      result.success === true
    ) {

      setStatus(
        "🟢 เชื่อมต่อ Apps Script สำเร็จ",
        "success"
      );

    }

    else {

      throw new Error(
        "Backend ตอบกลับไม่ถูกต้อง"
      );

    }

  }

  catch(error) {

    console.error(
      "BACKEND ERROR:",
      error
    );


    setStatus(
      "❌ เชื่อมต่อ Apps Script ไม่สำเร็จ: " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }

}


/* =========================================================
   INITIAL
========================================================= */

window.addEventListener(
  "load",
  function() {

    updateButtons();


    /*
     * ทดสอบ Backend ตอนเปิดเว็บ
     */

    testBackend();

  }
);


/* =========================================================
   PAGE CLOSE
========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      cameraRunning
    ) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>
