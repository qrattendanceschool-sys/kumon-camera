<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Kumon Central Korat - QR Attendance</title>

  <!-- QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f4f6fa;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #172033;
    }

    .container {
      max-width: 1050px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    }

    .header {
      text-align: center;
    }

    .title {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 25px;
      color: #666;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .branch {
      font-size: 21px;
      font-weight: 700;
      color: #344054;
    }

    #reader {
      width: 100%;
      min-height: 430px;
      background: #101827;
      border-radius: 22px;
      overflow: hidden;
      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      max-height: 600px;
      object-fit: cover;
    }

    .camera-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d0d5dd;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    .status {
      border-radius: 18px;
      padding: 18px 22px;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .status.ok {
      background: #dcfae8;
      color: #087443;
    }

    .status.error {
      background: #fee4e2;
      color: #b42318;
    }

    .status.warning {
      background: #fff4cc;
      color: #8a5a00;
    }

    .status.info {
      background: #e8f1ff;
      color: #175cd3;
    }

    .result {
      border-radius: 20px;
      padding: 26px;
      background: #f8f9fb;
      border: 1px solid #e4e7ec;
      margin-bottom: 18px;
    }

    .result.success {
      background: #ecfdf3;
      border-color: #abefc6;
    }

    .result.error {
      background: #fff4f2;
      border-color: #fecdca;
    }

    .result-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .result-line {
      font-size: 20px;
      margin: 8px 0;
    }

    .qr-value {
      background: #eef0f3;
      border-radius: 12px;
      padding: 14px;
      font-size: 18px;
      color: #475467;
      word-break: break-all;
      margin-bottom: 18px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 20px 12px;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      min-height: 70px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-open {
      background: #2563eb;
    }

    .btn-stop {
      background: #ef4444;
    }

    .btn-switch {
      background: #667085;
    }

    .btn-next {
      background: #16a34a;
      width: 100%;
      margin-top: 10px;
    }

    @media (max-width: 700px) {

      body {
        padding: 10px;
      }

      .card {
        padding: 16px;
        border-radius: 18px;
      }

      .title {
        font-size: 28px;
      }

      .subtitle {
        font-size: 20px;
      }

      .branch {
        font-size: 17px;
      }

      #reader {
        min-height: 300px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      button {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="card header">

    <div class="title">
      📷 Kumon Central Korat
    </div>

    <div class="subtitle">
      สแกน QR เข้า-ออก
    </div>

    <div class="branch">
      Branch: B001 | สาขาหลัก | Device: B001-01
    </div>

  </div>


  <!-- CAMERA -->
  <div class="card">

    <div id="reader">

      <div
        id="cameraMessage"
        class="camera-message"
      >
        📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน
      </div>

    </div>

  </div>


  <!-- CONNECTION STATUS -->

  <div
    id="connectionStatus"
    class="status warning"
  >
    ⏳ กำลังตรวจสอบการเชื่อมต่อ Apps Script...
  </div>


  <!-- RESULT -->

  <div
    id="resultBox"
    style="display:none;"
    class="result"
  >

    <div
      id="resultTitle"
      class="result-title"
    ></div>

    <div
      id="resultContent"
    ></div>

    <button
      id="nextButton"
      class="btn-next"
      onclick="prepareNextScan()"
    >
      🔍 สแกนคนถัดไป
    </button>

  </div>


  <!-- CONTROLS -->

  <div class="card">

    <div class="buttons">

      <button
        id="openButton"
        class="btn-open"
        onclick="openCamera()"
      >
        📷 เปิดกล้อง
      </button>

      <button
        id="stopButton"
        class="btn-stop"
        onclick="stopCamera()"
        disabled
      >
        ⛔ ปิดกล้อง
      </button>

      <button
        id="switchButton"
        class="btn-switch"
        onclick="switchCamera()"
        disabled
      >
        🔄 สลับกล้อง
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfcybyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec";

const BRANCH_ID = "B001";

const DEVICE_ID = "B001-01";


/* =========================================================
   GLOBAL STATE
========================================================= */

let scanner = null;

let scannerRunning = false;

let scannerStarting = false;

let scannerStopping = false;

let processingQR = false;

let currentCameraId = null;

let cameras = [];

let cameraIndex = 0;

let lastQR = "";

let lastScanTime = 0;

const SCAN_COOLDOWN = 2500;


/* =========================================================
   ELEMENTS
========================================================= */

const connectionStatus =
  document.getElementById("connectionStatus");

const resultBox =
  document.getElementById("resultBox");

const resultTitle =
  document.getElementById("resultTitle");

const resultContent =
  document.getElementById("resultContent");

const cameraMessage =
  document.getElementById("cameraMessage");

const openButton =
  document.getElementById("openButton");

const stopButton =
  document.getElementById("stopButton");

const switchButton =
  document.getElementById("switchButton");


/* =========================================================
   STATUS
========================================================= */

function setStatus(type, text) {

  connectionStatus.className =
    "status " + type;

  connectionStatus.textContent = text;

}


/* =========================================================
   JSONP
========================================================= */

function callAppsScript(params) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "__qrCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement("script");

    let finished = false;

    const timeout =
      setTimeout(() => {

        if (finished) return;

        finished = true;

        cleanup();

        reject(
          new Error(
            "Apps Script ไม่ตอบกลับภายในเวลาที่กำหนด"
          )
        );

      }, 15000);


    window[callbackName] =
      function(data) {

        if (finished) return;

        finished = true;

        clearTimeout(timeout);

        cleanup();

        resolve(data);

      };


    function cleanup() {

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }


    const query =
      new URLSearchParams();


    Object.keys(params).forEach(key => {

      if (
        params[key] !== undefined &&
        params[key] !== null
      ) {

        query.set(
          key,
          params[key]
        );

      }

    });


    query.set(
      "callback",
      callbackName
    );


    query.set(
      "_t",
      Date.now()
    );


    script.src =
      APPS_SCRIPT_URL +
      "?" +
      query.toString();


    script.onerror =
      function() {

        if (finished) return;

        finished = true;

        clearTimeout(timeout);

        cleanup();

        reject(
          new Error(
            "ไม่สามารถเรียก Apps Script ได้"
          )
        );

      };


    document.body.appendChild(script);

  });

}


/* =========================================================
   TEST CONNECTION
========================================================= */

async function testConnection() {

  setStatus(
    "warning",
    "⏳ กำลังเชื่อมต่อ Apps Script..."
  );


  try {

    const data =
      await callAppsScript({
        action: "ping"
      });


    console.log(
      "PING RESULT:",
      data
    );


    if (
      data &&
      data.success === true
    ) {

      setStatus(
        "ok",
        "✅ เชื่อมต่อ Apps Script สำเร็จ"
      );

      return true;

    }


    throw new Error(
      data && data.error
        ? data.error
        : "Apps Script ตอบกลับผิดรูปแบบ"
    );


  } catch (error) {

    console.error(
      "PING ERROR:",
      error
    );


    setStatus(
      "error",
      "❌ เชื่อมต่อ Apps Script ไม่สำเร็จ: " +
      error.message
    );

    return false;

  }

}


/* =========================================================
   CAMERA LIST
========================================================= */

async function loadCameras() {

  try {

    cameras =
      await Html5Qrcode.getCameras();


    console.log(
      "CAMERAS:",
      cameras
    );


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้องในอุปกรณ์"
      );

    }


    cameraIndex = 0;


    return cameras;

  } catch (error) {

    console.error(
      "GET CAMERA ERROR:",
      error
    );

    throw error;

  }

}


/* =========================================================
   OPEN CAMERA
========================================================= */

async function openCamera() {

  /*
   ป้องกันการกดเปิดซ้ำ
  */

  if (
    scannerStarting ||
    scannerStopping
  ) {

    console.log(
      "Camera transition in progress"
    );

    return;

  }


  if (scannerRunning) {

    console.log(
      "Camera already running"
    );

    return;

  }


  scannerStarting = true;


  openButton.disabled = true;

  stopButton.disabled = true;

  switchButton.disabled = true;


  try {

    cameraMessage.style.display =
      "flex";

    cameraMessage.textContent =
      "📷 กำลังเปิดกล้อง...";


    /*
      ถ้ามี scanner เก่า
      ให้สร้างใหม่
    */

    if (!scanner) {

      scanner =
        new Html5Qrcode("reader");

    }


    /*
      โหลดรายการกล้อง
    */

    if (
      !cameras ||
      cameras.length === 0
    ) {

      await loadCameras();

    }


    /*
      เลือกกล้องหลังเป็นค่าเริ่มต้น
    */

    let selectedCamera =
      cameras.find(
        cam =>
          /back|rear|environment/i
            .test(cam.label)
      );


    if (!selectedCamera) {

      selectedCamera =
        cameras[0];

    }


    cameraIndex =
      cameras.findIndex(
        cam =>
          cam.id === selectedCamera.id
      );


    if (cameraIndex < 0) {
      cameraIndex = 0;
    }


    currentCameraId =
      selectedCamera.id;


    await scanner.start(

      currentCameraId,

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.65;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      onScanSuccess,

      onScanFailure

    );


    scannerRunning = true;

    cameraMessage.style.display =
      "none";


    stopButton.disabled = false;

    switchButton.disabled =
      cameras.length < 2;


    setStatus(
      "ok",
      "🟢 กล้องพร้อมสแกน"
    );


  } catch (error) {

    console.error(
      "OPEN CAMERA ERROR:",
      error
    );


    scannerRunning = false;


    cameraMessage.style.display =
      "flex";

    cameraMessage.textContent =
      "📷 กด \"เปิดกล้อง\" เพื่อเริ่มสแกน";


    setStatus(
      "error",
      "❌ เปิดกล้องไม่สำเร็จ: " +
      getCameraError(error)
    );


  } finally {

    scannerStarting = false;

    openButton.disabled =
      scannerRunning;

    stopButton.disabled =
      !scannerRunning;

    switchButton.disabled =
      !scannerRunning ||
      cameras.length < 2;

  }

}


/* =========================================================
   CAMERA ERROR
========================================================= */

function getCameraError(error) {

  if (!error) {
    return "ไม่ทราบสาเหตุ";
  }


  const message =
    error.message ||
    String(error);


  if (
    /NotAllowedError/i.test(message)
  ) {

    return "ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาต Camera ใน Browser";

  }


  if (
    /Permission/i.test(message)
  ) {

    return "Browser ไม่ได้รับอนุญาตให้ใช้กล้อง";

  }


  if (
    /NotFoundError/i.test(message)
  ) {

    return "ไม่พบกล้อง";

  }


  if (
    /NotReadableError/i.test(message)
  ) {

    return "กล้องกำลังถูกใช้งานโดยแอปอื่น";

  }


  if (
    /transition/i.test(message)
  ) {

    return "กล้องกำลังเปลี่ยนสถานะ กรุณารอสักครู่แล้วลองใหม่";

  }


  return message;

}


/* =========================================================
   SCAN FAILURE
========================================================= */

function onScanFailure(errorMessage) {

  /*
    ไม่ต้องแสดง error ทุก frame
    เพราะ scanner จะเรียก function นี้ตลอด
  */

}


/* =========================================================
   QR SUCCESS
========================================================= */

async function onScanSuccess(decodedText) {

  const now =
    Date.now();


  /*
    ป้องกัน QR เดิมยิงซ้ำ
  */

  if (
    processingQR
  ) {

    return;

  }


  if (
    decodedText === lastQR &&
    now - lastScanTime <
      SCAN_COOLDOWN
  ) {

    return;

  }


  processingQR = true;

  lastQR =
    decodedText;

  lastScanTime =
    now;


  console.log(
    "QR:",
    decodedText
  );


  /*
    หยุดกล้องก่อนส่งข้อมูล
    เพื่อป้องกันการยิง QR ซ้ำ
  */

  await pauseCamera();


  await sendQR(decodedText);

}


/* =========================================================
   PAUSE CAMERA
========================================================= */

async function pauseCamera() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    return;

  }


  if (scannerStopping) {

    return;

  }


  scannerStopping = true;


  try {

    await scanner.stop();

    scannerRunning = false;


  } catch (error) {

    console.warn(
      "STOP AFTER SCAN:",
      error
    );


    scannerRunning = false;

  } finally {

    scannerStopping = false;

    openButton.disabled = false;

    stopButton.disabled = true;

    switchButton.disabled = true;

  }

}


/* =========================================================
   SEND QR TO APPS SCRIPT
========================================================= */

async function sendQR(payload) {

  resultBox.style.display =
    "block";


  resultBox.className =
    "result";


  resultTitle.textContent =
    "⏳ กำลังบันทึกข้อมูล...";


  resultContent.innerHTML =
    `
      <div class="qr-value">
        QR: ${escapeHtml(payload)}
      </div>
    `;


  try {

    /*
      ส่งผ่าน JSONP
      ไม่ใช้ fetch()
    */

    const data =
      await callAppsScript({

        action: "scan",

        branch: BRANCH_ID,

        device: DEVICE_ID,

        payload: payload

      });


    console.log(
      "SCAN RESULT:",
      data
    );


    if (
      data &&
      data.success === true
    ) {

      showSuccess(
        data,
        payload
      );

    } else {

      showScanError(
        data &&
        data.error
          ? data.error
          : "Apps Script ไม่สามารถบันทึกข้อมูลได้",
        payload
      );

    }


  } catch (error) {

    console.error(
      "SCAN ERROR:",
      error
    );


    showScanError(
      error.message,
      payload
    );

  }

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
  data,
  payload
) {

  resultBox.style.display =
    "block";

  resultBox.className =
    "result success";


  const direction =
    data.direction || "-";

  const studentId =
    data.studentId || "-";

  const fullName =
    data.fullName || "-";

  const subject =
    data.subject || "-";

  const message =
    data.message ||
    "บันทึกข้อมูลสำเร็จ";

  const time =
    data.time || "-";


  let icon =
    direction === "IN"
      ? "🟢"
      : "🔴";


  let directionText =
    direction === "IN"
      ? "เข้าเรียน"
      : direction === "OUT"
        ? "ออกจากห้องเรียน"
        : direction;


  resultTitle.textContent =
    icon +
    " " +
    message;


  resultContent.innerHTML =
    `
      <div class="qr-value">
        QR: ${escapeHtml(payload)}
      </div>

      <div class="result-line">
        👤 <b>นักเรียน:</b>
        ${escapeHtml(fullName)}
      </div>

      <div class="result-line">
        🆔 <b>Student ID:</b>
        ${escapeHtml(studentId)}
      </div>

      <div class="result-line">
        📚 <b>วิชา:</b>
        ${escapeHtml(subject)}
      </div>

      <div class="result-line">
        ↔️ <b>สถานะ:</b>
        ${escapeHtml(directionText)}
      </div>

      <div class="result-line">
        🕐 <b>เวลา:</b>
        ${escapeHtml(time)}
      </div>
    `;


  setStatus(
    "ok",
    "✅ บันทึกข้อมูลสำเร็จ"
  );

}


/* =========================================================
   ERROR
========================================================= */

function showScanError(
  message,
  payload
) {

  resultBox.style.display =
    "block";

  resultBox.className =
    "result error";


  resultTitle.textContent =
    "❌ บันทึกข้อมูลไม่สำเร็จ";


  resultContent.innerHTML =
    `
      <div class="qr-value">
        QR: ${escapeHtml(payload)}
      </div>

      <div class="result-line">
        <b>สาเหตุ:</b>
        ${escapeHtml(message)}
      </div>
    `;


  setStatus(
    "error",
    "❌ ไม่สามารถบันทึกข้อมูลได้"
  );

}


/* =========================================================
   NEXT SCAN
========================================================= */

async function prepareNextScan() {

  resultBox.style.display =
    "none";


  processingQR = false;

  lastQR = "";

  lastScanTime = 0;


  /*
    รอเล็กน้อยก่อนเปิดกล้องใหม่
    ป้องกัน state transition
  */

  await delay(500);


  openCamera();

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function stopCamera() {

  if (
    scannerStopping
  ) {

    return;

  }


  if (
    !scanner ||
    !scannerRunning
  ) {

    return;

  }


  scannerStopping = true;


  try {

    await scanner.stop();

    scannerRunning = false;


    cameraMessage.style.display =
      "flex";

    cameraMessage.textContent =
      "📷 กด \"เปิดกล้อง\" เพื่อเริ่มสแกน";


  } catch (error) {

    console.error(
      "STOP CAMERA ERROR:",
      error
    );


  } finally {

    scannerStopping = false;

    processingQR = false;

    openButton.disabled = false;

    stopButton.disabled = true;

    switchButton.disabled = true;

  }

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera() {

  if (
    cameras.length < 2
  ) {

    return;

  }


  if (
    scannerStarting ||
    scannerStopping
  ) {

    return;

  }


  if (
    !scannerRunning
  ) {

    return;

  }


  scannerStopping = true;


  try {

    await scanner.stop();

    scannerRunning = false;


    cameraIndex =
      (cameraIndex + 1) %
      cameras.length;


    currentCameraId =
      cameras[cameraIndex].id;


    await delay(300);


    scannerStopping = false;


    await openCamera();


  } catch (error) {

    console.error(
      "SWITCH CAMERA ERROR:",
      error
    );


    scannerStopping = false;

    scannerRunning = false;


    setStatus(
      "error",
      "❌ สลับกล้องไม่สำเร็จ: " +
      getCameraError(error)
    );


    openButton.disabled = false;

    stopButton.disabled = true;

    switchButton.disabled = true;

  }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   DELAY
========================================================= */

function delay(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}
