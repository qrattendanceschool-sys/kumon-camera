<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Camera Test</title>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f5f5f5;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .card {
      background: white;

      border-radius: 16px;

      padding: 16px;

      margin-bottom: 16px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
    }

    .status {
      padding: 14px;

      border-radius: 10px;

      background: #f0f0f0;

      text-align: center;

      font-size: 18px;

      font-weight: 600;

      margin-bottom: 15px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .qr-result {
      word-break: break-all;

      background: #f8f8f8;

      padding: 12px;

      border-radius: 10px;

      font-size: 16px;
    }

    button {

      width: 100%;

      padding: 14px;

      margin-top: 10px;

      border: none;

      border-radius: 10px;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

    }

    .start {
      background: #2563eb;
      color: white;
    }

    .stop {
      background: #dc2626;
      color: white;
    }

    .continue {
      background: #16a34a;
      color: white;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📷 QR Camera Test
  </h1>


  <div class="subtitle">

    ทดสอบกล้องและการอ่าน QR Code

  </div>


  <!-- CAMERA -->

  <div class="card">

    <div
      id="reader"
    ></div>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >

    กำลังเตรียมกล้อง...

  </div>


  <!-- RESULT -->

  <div
    id="resultCard"
    class="card"
    style="display:none;"
  >

    <h2>
      ✅ อ่าน QR สำเร็จ
    </h2>


    <div
      class="qr-result"
      id="qrResult"
    ></div>


    <button
      class="continue"
      onclick="scanAgain()"
    >

      🔍 สแกนอีกครั้ง

    </button>


  </div>


  <!-- BUTTONS -->

  <div class="card">

    <button
      class="start"
      onclick="startScanner()"
    >

      📷 เปิดกล้อง

    </button>


    <button
      class="stop"
      onclick="stopScanner()"
    >

      ⛔ ปิดกล้อง

    </button>

  </div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let scanning = false;

let lastQR = '';

let lastQRTime = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox =
  document.getElementById(
    'status'
  );


const resultCard =
  document.getElementById(
    'resultCard'
  );


const qrResult =
  document.getElementById(
    'qrResult'
  );


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  type = ''
) {

  statusBox.textContent =
    text;


  statusBox.className =
    'status';


  if (type) {

    statusBox.classList.add(
      type
    );

  }

}


/* =====================================================
   BEEP
===================================================== */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.frequency.value =
      1000;


    gain.gain.value =
      0.15;


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      0.12
    );

  }

  catch (error) {

    console.log(
      'Beep error:',
      error
    );

  }

}


/* =====================================================
   START SCANNER
===================================================== */

async function startScanner() {

  if (scanning) {

    return;

  }


  try {

    setStatus(
      'กำลังเปิดกล้อง...'
    );


    /*
     * สร้าง Scanner
     */

    if (!scanner) {

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }


    /*
     * ขอรายชื่อกล้อง
     */

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'ไม่พบกล้อง'
      );

    }


    /*
     * หาหลังเครื่องก่อน
     */

    let cameraId =
      cameras[0].id;


    const backCamera =
      cameras.find(
        camera =>
          /back|rear|environment/i
            .test(
              camera.label || ''
            )
      );


    if (backCamera) {

      cameraId =
        backCamera.id;

    }


    /*
     * เริ่มกล้อง
     */

    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      () => {}

    );


    scanning =
      true;


    setStatus(
      '🟢 กล้องพร้อม — เล็ง QR Code ได้เลย',
      'success'
    );

  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      '❌ เปิดกล้องไม่สำเร็จ: ' +
      (
        error.message ||
        error
      ),
      'error'
    );

  }

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {

    await scanner.stop();

    await scanner.clear();

  }

  catch (error) {

    console.log(
      'Stop error:',
      error
    );

  }


  scanning =
    false;


  setStatus(
    'กล้องปิดแล้ว'
  );

}


/* =====================================================
   QR SUCCESS
===================================================== */

async function onScanSuccess(
  decodedText
) {

  const now =
    Date.now();


  /*
   * ป้องกัน QR เดิมยิงซ้ำ
   */

  if (

    decodedText === lastQR &&

    now - lastQRTime < 3000

  ) {

    return;

  }


  lastQR =
    decodedText;


  lastQRTime =
    now;


  /*
   * หยุด scanner
   */

  await stopScanner();


  /*
   * เสียง
   */

  beep();


  /*
   * แสดง QR
   */

  qrResult.textContent =
    decodedText;


  resultCard.style.display =
    'block';


  setStatus(
    '✅ อ่าน QR สำเร็จ',
    'success'
  );


  console.log(
    'QR RESULT:',
    decodedText
  );

}


/* =====================================================
   SCAN AGAIN
===================================================== */

async function scanAgain() {

  resultCard.style.display =
    'none';


  lastQR =
    '';


  lastQRTime =
    0;


  await startScanner();

}


/* =====================================================
   AUTO START
===================================================== */

window.addEventListener(
  'load',
  function() {

    /*
     * ยังไม่เปิดกล้องอัตโนมัติ
     *
     * ให้ผู้ใช้กดปุ่ม
     * เพื่อให้ Browser
     * อนุญาต Camera
     */

    setStatus(
      'พร้อมเปิดกล้อง'
    );

  }
);


</script>


</body>

</html>
