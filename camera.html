/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

   STATUS
========================================================= */

) {

  apiStatus.className =

  apiStatus.textContent =

}

  const direction =

      : data.direction === "OUT"
        ? "🔴 CHECK-OUT"
        : data.direction || "";


  const duration =
    data.durationMin !== "" &&
    data.durationMin !== null &&
    data.durationMin !== undefined
      ? "เวลาเรียน: " +
        data.durationMin +
        " นาที"
      : "";


  const flag =
    data.flag
      ? " ⏰ " +
        data.flag
      : "";


  resultEl.className =
    "card result success";


  resultEl.innerHTML =

    "<div class='student-name'>" +

      escapeHtml(
        data.fullName ||
        data.studentId ||
        "-"
      ) +

    "</div>" +


    "<div class='direction'>" +

      escapeHtml(
        direction
      ) +

    "</div>" +


    "<div class='detail'>" +

      "รหัส: " +

      escapeHtml(
        data.studentId ||
        "-"
      ) +

    "</div>" +


    "<div class='detail'>" +

      "วิชา: " +

      escapeHtml(
        data.subject ||
        "-"
      ) +

    "</div>" +


    "<div class='detail'>" +

      "เวลา: " +

      escapeHtml(
        data.time ||
        "-"
      ) +

    "</div>" +


    (
      duration
        ? "<div class='detail'>" +
          escapeHtml(
            duration
          ) +
          escapeHtml(
            flag
          ) +
          "</div>"
        : ""
    ) +


    "<div class='detail'>" +

      escapeHtml(
        data.message ||
        ""
      ) +

    "</div>";

}


/* =========================================================
   JSONP API
========================================================= */

/*
  สำคัญ:

  GitHub Pages
        ↓
  script tag
        ↓
  Apps Script

  ไม่ใช้ google.script.run
  ไม่ใช้ fetch
*/

function callAPI(
  action,
  params = {}
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callbackName =
        "kumonCallback_" +
        Date.now() +
        "_" +
        (++callbackCounter);


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const query =
        new URLSearchParams();


      query.set(
        "action",
        action
      );


      query.set(
        "callback",
        callbackName
      );


      Object.entries(
        params
      ).forEach(
        function([
          key,
          value
        ]) {

          if (
            value !== undefined &&
            value !== null
          ) {

            query.set(
              key,
              String(value)
            );

          }

        }
      );


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "Apps Script ไม่ตอบกลับภายใน 15 วินาที"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] =
            undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (
            !response
          ) {

            reject(
              new Error(
                "Apps Script ไม่ส่งข้อมูลกลับมา"
              )
            );

            return;

          }


          if (
            response.success !== true
          ) {

            reject(
              new Error(
                response.error ||
                response.message ||
                "ระบบไม่สามารถดำเนินการได้"
              )
            );

            return;

          }


          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "โหลด Apps Script ไม่สำเร็จ"
            )
          );

        };


      script.src =
        API_URL +
        "?" +
        query.toString();


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   TEST API
========================================================= */

async function testAPI() {

  setStatus(
    "⏳ กำลังเชื่อมต่อ Apps Script...",
    "warning"
  );


  try {

    const response =
      await callAPI(
        "ping",
        {
          branch:
            BRANCH_ID,

          device:
            DEVICE_ID
        }
      );


    if (
      !response ||
      response.success !== true
    ) {

      throw new Error(
        "Apps Script ตอบกลับไม่ถูกต้อง"
      );

    }


    systemInfo.textContent =
      "Branch: " +
      BRANCH_ID +
      " | Device: " +
      DEVICE_ID;


    setStatus(
      "🟢 เชื่อมต่อ Apps Script สำเร็จ",
      "success"
    );


    return true;


  } catch (error) {

    console.error(
      "API TEST ERROR:",
      error
    );


    setStatus(
      "❌ เชื่อมต่อ Apps Script ไม่สำเร็จ",
      "error"
    );


    showDebug(
      "API TEST ERROR\n\n" +
      error.message +
      "\n\n" +
      API_URL
    );


    return false;

  }

}

/* =========================================================
   CAMERA LIST
========================================================= */

async function getCamerasFresh() {

  try {

    const list =
      await Html5Qrcode
        .getCameras();


    cameras =
      Array.isArray(list)
        ? list
        : [];


    return cameras;


  } catch (error) {

    console.error(
      "GET CAMERAS ERROR:",
      error
    );


    cameras =
      [];


    throw error;

  }

}


/* =========================================================
   PICK CAMERA
========================================================= */

function pickDefaultCamera(
  list
) {

  const savedId =
    localStorage.getItem(
      LS_KEY_ID
    );


  if (
    savedId &&
    list.some(
      function(camera) {

        return (
          camera.id ===
          savedId
        );

      }
    )
  ) {

    return savedId;

  }


  const back =
    list.find(
      function(camera) {

        return /back|rear|environment/i
          .test(
            camera.label || ""
          );

      }
    );


  if (back) {

    return back.id;

  }


  return list[0]
    ? list[0].id
    : null;

}


/* =========================================================
   START WITH DEVICE ID
========================================================= */

async function startCameraById(
  deviceId
) {

  if (!qr) {

    qr =
      new Html5Qrcode(
        "scanner"
      );

  }


  /*
    ถ้ากำลังทำงานอยู่
    ต้องหยุดก่อน
  */

  if (cameraRunning) {

    try {

      await qr.stop();

    } catch (e) {}

    cameraRunning =
      false;

  }


  await qr.start(

    {
      deviceId: {
        exact:
          deviceId
      }
    },

    {
      fps:
        SCAN_FPS,

      qrbox: {
        width:
          QR_BOX,

        height:
          QR_BOX
      },

      aspectRatio:
        1.777778

    },

    onScanSuccess,

    function() {}

  );


  currentCameraId =
    deviceId;


  currentFacing =
    null;


  localStorage.setItem(
    LS_KEY_ID,
    deviceId
  );


  localStorage.removeItem(
    LS_KEY_FACING
  );


  cameraRunning =
    true;


  cameraStartedUI();

}


/* =========================================================
   START WITH FACING MODE
========================================================= */

async function startCameraDirect(
  facing
) {

  if (!qr) {

    qr =
      new Html5Qrcode(
        "scanner"
      );

  }


  if (cameraRunning) {

    try {

      await qr.stop();

    } catch (e) {}

    cameraRunning =
      false;

  }


  await qr.start(

    {
      facingMode:
        facing
    },

    {
      fps:
        SCAN_FPS,

      qrbox: {
        width:
          QR_BOX,

        height:
          QR_BOX
      },

      aspectRatio:
        1.777778

    },

    onScanSuccess,

    function() {}

  );


  currentFacing =
    facing;


  currentCameraId =
    null;


  localStorage.setItem(
    LS_KEY_FACING,
    facing
  );


  localStorage.removeItem(
    LS_KEY_ID
  );


  cameraRunning =
    true;


  cameraStartedUI();

}

   CAMERA UI
========================================================= */

  cameraStatus.textContent =

  btnStop.disabled =
    false;


  btnSwitch.disabled =

/* =========================================================
   START CAMERA SMART
========================================================= */

async function startCameraSmart() {

  if (isStarting) {
    return;
  }


  if (cameraRunning) {
    return;
  }


  isStarting =
    true;


  try {

    if (!qr) {

      qr =
        new Html5Qrcode(
          "scanner"
        );

    }


    await getCamerasFresh();


    if (
      cameras.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้องในอุปกรณ์"
      );

    }


    /*
      1. ลองกล้องที่เคยใช้
    */

    const savedId =
      localStorage.getItem(
        LS_KEY_ID
      );


    if (savedId) {

      try {

        await startCameraById(
          savedId
        );

        return;

      } catch (error) {

        console.warn(
          "Saved camera failed:",
          error
        );

      }

    }


    /*
      2. ใช้กล้องหลัง
    */

    try {

      await startCameraDirect(
        "environment"
      );

      return;

    } catch (error) {

      console.warn(
        "Environment failed:",
        error
      );

    }


    /*
      3. ถ้าไม่ได้ ใช้กล้องหน้า
    */

    await startCameraDirect(
      "user"
    );


  } finally {

    isStarting =
      false;

  }

}


/* =========================================================
   START SCAN
========================================================= */

async function startScan() {

  if (isStarting) {
    return;
  }


  if (cameraRunning) {
    return;
  }


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    showError(
      "ไม่พบ QR Scanner กรุณารีเฟรชหน้าเว็บ"
    );

    return;

  }


  cameraStatus.textContent =
    "กล้อง: กำลังเปิด...";


  try {

    await startCameraSmart();


    setStatus(
      "🟢 พร้อมสแกน QR",
      "success"
    );


  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    cameraRunning =
      false;


    cameraStatus.textContent =
      "กล้อง: เปิดไม่สำเร็จ";


    showError(
      getCameraErrorMessage(
        error
      )
    );


    btnStart.disabled =
      false;


    btnStop.disabled =
      true;


    btnSwitch.disabled =
      true;

  }

}


/* =========================================================
   CAMERA ERROR
========================================================= */

function getCameraErrorMessage(
  error
) {

  const name =
    error &&
    error.name
      ? error.name
      : "Error";


  const message =
    error &&
    error.message
      ? error.message
      : String(error);


  if (
    /NotAllowedError/i
      .test(
        name + " " + message
      )
  ) {

    return (
      "เปิดกล้องไม่ได้: " +
      "Browser ไม่อนุญาตให้ใช้กล้อง " +
      "(" +
      name +
      ")"
    );

  }


  if (
    /NotFoundError/i
      .test(
        name + " " + message
      )
  ) {

    return (
      "ไม่พบกล้องในอุปกรณ์"
    );

  }


  if (
    /NotReadableError/i
      .test(
        name + " " + message
      )
  ) {

    return (
      "กล้องกำลังถูกใช้งานโดยแอปอื่น"
    );

  }


  if (
    /transition/i
      .test(
        message
      )
  ) {

    return (
      "กล้องกำลังเปลี่ยนสถานะ " +
      "กรุณารอสักครู่"
    );

  }


  return (
    "เปิดกล้องไม่ได้: " +
    name +
    " — " +
    message
  );

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function stopScanner() {

  if (
    !qr ||
    isStopping
  ) {

    return;

  }


  isStopping =
    true;


  try {

    if (cameraRunning) {

      await qr.stop();

    }

  } catch (error) {

    console.warn(
      "STOP CAMERA:",
      error
    );

  }


  cameraRunning =
    false;


  isStopping =
    false;


  cameraStatus.textContent =
    "กล้อง: หยุดแล้ว";


  btnStart.disabled =
    false;


  btnStop.disabled =
    true;


  btnSwitch.disabled =
    true;

}


async function stopScan() {

  await stopScanner();

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera() {

  if (
    isStarting ||
    isStopping ||
    !cameraRunning
  ) {

    return;

  }


  isStopping =
    true;


  try {

    await qr.stop();

    cameraRunning =
      false;


    await getCamerasFresh();


    if (
      cameras.length >= 2 &&
      currentCameraId
    ) {

      const index =
        cameras.findIndex(
          function(camera) {

            return (
              camera.id ===
              currentCameraId
            );

          }
        );


      const nextIndex =
        index === -1
          ? 0
          : (
              index + 1
            ) %
            cameras.length;


      isStopping =
        false;


      await startCameraById(
        cameras[nextIndex].id
      );


      setStatus(
        "🔄 สลับกล้องแล้ว",
        "success"
      );


      return;

    }


    /*
      fallback:
      facing mode
    */

    const nextFacing =
      currentFacing ===
        "environment"
        ? "user"
        : "environment";


    isStopping =
      false;


    await startCameraDirect(
      nextFacing
    );


    setStatus(
      "🔄 สลับกล้องแล้ว",
      "success"
    );


  } catch (error) {

    isStopping =
      false;


    cameraRunning =
      false;


    showError(
      "สลับกล้องไม่สำเร็จ: " +
      getCameraErrorMessage(
        error
      )
    );


    btnStart.disabled =
      false;


    btnStop.disabled =
      true;


    btnSwitch.disabled =
      true;

  }

}


/* =========================================================
   QR SUCCESS
========================================================= */

async function onScanSuccess(
  decodedText
) {

  if (
    busy ||
    !cameraRunning ||
    !decodedText
  ) {

    return;

  }


  busy =
    true;


  /*
    หยุดกล้องก่อน
    ป้องกัน QR เดิมยิงซ้ำ
  */

  try {

    await stopScanner();

  } catch (error) {

    console.warn(
      error
    );

  }


  resultEl.className =
    "card result";


  resultEl.innerHTML =
    "⏳ กำลังบันทึกข้อมูล...";


  setStatus(
    "⏳ กำลังส่งข้อมูลไป Apps Script...",
    "info"
  );


  try {

    const response =
      await callAPI(

        "scan",

        {

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID,

          payload:
            decodedText

        }

      );


    safeBeep();


    showOK(
      response
    );


    setStatus(
      "✅ บันทึกข้อมูลสำเร็จ",
      "success"
    );


    /*
      อัปเดต Board
    */

    refreshBoards();


    /*
      เปิดกล้องใหม่อัตโนมัติ
    */

    setTimeout(
      function() {

        busy =
          false;


        startScan();

      },
      700
    );


  } catch (error) {

    console.error(
      "SCAN ERROR:",
      error
    );


    safeErrorSound();


    showError(
      error.message
    );


    setStatus(
      "❌ " +
      error.message,
      "error"
    );


    busy =
      false;


    /*
      ให้ผู้ใช้เปิดกล้องใหม่
      ไม่เปิดซ้อนทันที
    */

  }

}


/* =========================================================
   STATUS BOARD
========================================================= */

async function refreshBoards() {

  if (!BRANCH_ID) {
    return;
  }


  /*
    MATH
  */

  try {

    const response =
      await callAPI(

        "status",

        {

          branch:
            BRANCH_ID,

          subject:
            "MATH"

        }

      );


    renderBoard(
      "list-math",
      "count-math",
      response.data
    );


  } catch (error) {

    console.warn(
      "MATH BOARD:",
      error
    );

  }


  /*
    LANGUAGE
    ใช้ action=languages
    เพราะ Backend รองรับ ENG/TRP/EFL
  */

  try {

    const response =
      await callAPI(

        "languages",

        {

          branch:
            BRANCH_ID

        }

      );


    renderBoard(
      "list-lang",
      "count-lang",
      response.data
    );


  } catch (error) {

    console.warn(
      "LANG BOARD:",
      error
    );

  }

}


/* =========================================================
   RENDER BOARD
========================================================= */

function renderBoard(
  listId,
  countId,
  list
) {

  const listEl =
    document.getElementById(
      listId
    );


  const countEl =
    document.getElementById(
      countId
    );


  if (!listEl) {
    return;
  }


  list =
    Array.isArray(list)
      ? list
      : [];


  countEl.textContent =
    list.length +
    " คน";


  if (
    list.length === 0
  ) {

    listEl.innerHTML =
      '<div class="meta">' +
      '— ไม่มีคนกำลังเรียน —' +
      '</div>';


    return;

  }


  listEl.innerHTML =
    list
      .map(
        function(item) {

          const overClass =
            item.over
              ? " status-over"
              : "";


          const warning =
            item.over
              ? " ⏰ เกินเวลา"
              : "";


          return (

            '<div class="item' +
            overClass +
            '">' +


              '<div>' +

                '<div class="name">' +

                  escapeHtml(
                    item.fullName ||
                    item.studentId
                  ) +

                '</div>' +


                '<div class="meta">' +

                  escapeHtml(
                    item.studentId
                  ) +

                  " | " +

                  escapeHtml(
                    item.subject
                  ) +

                '</div>' +

              '</div>' +


              '<div class="meta">' +

                escapeHtml(
                  item.minutes
                ) +

                " นาที" +

                warning +

              '</div>' +


            '</div>'

          );

        }
      )
      .join("");

}


/* =========================================================
   AUTO REFRESH BOARD
========================================================= */

let boardTimer =
  null;


function startBoardTimer() {

  if (boardTimer) {
    return;
  }


  boardTimer =
    setInterval(
      function() {

        refreshBoards();

      },
      10000
    );

}


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
  "load",
  async function() {

    /*
      1. เชื่อมต่อ API
    */

    const connected =
      await testAPI();


    /*
      2. ถ้าเชื่อมต่อได้
         โหลด Board
    */

    if (connected) {

      refreshBoards();

      startBoardTimer();

    }

  }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible"
    ) {

      refreshBoards();

    }

  }
);


/* =========================================================
   GLOBAL FUNCTIONS
========================================================= */

window.startScan =
  startScan;


window.stopScan =
  stopScan;


window.switchCamera =
  switchCamera;

</script>
