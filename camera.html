<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Kumon Central Korat - QR Attendance</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f4f6fa;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: #fff;
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
      margin-bottom: 18px;
    }

    .title {
      font-size: 34px;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 22px;
      color: #6b7280;
      font-weight: 700;
    }

    .branch {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 800;
      color: #374151;
    }

    .camera-card {
      background: #fff;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
      margin-bottom: 16px;
    }

    #reader {
      width: 100%;
      min-height: 450px;
      background: #101827;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      display: block;
      object-fit: cover;
      border-radius: 18px;
    }

    #placeholder {
      min-height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: #d1d5db;
      font-size: 23px;
      font-weight: 800;
    }

    #scanFrame {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(340px, 65vw);
      height: min(340px, 65vw);
      border: 3px solid #fff;
      border-radius: 20px;
      pointer-events: none;
      z-index: 20;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.12);
    }

    #scanLine {
      position: absolute;
      left: 15px;
      right: 15px;
      top: 50%;
      height: 3px;
      background: #ef4444;
    }

    .status {
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 21px;
      font-weight: 900;
    }

    .info {
      background: #e0e7ff;
      color: #3730a3;
    }

    .loading {
      background: #fef3c7;
      color: #92400e;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #result {
      display: none;
      background: #fff;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    #result.success-result {
      border: 2px solid #86efac;
      background: #f0fdf4;
    }

    #result.error-result {
      border: 2px solid #fca5a5;
      background: #fef2f2;
    }

    #studentName {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    #direction {
      font-size: 29px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .result-line {
      font-size: 20px;
      font-weight: 700;
      margin: 9px 0;
    }

    #rawQR {
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      background: #e5e7eb;
      color: #374151;
      font-size: 14px;
      word-break: break-all;
    }

    .controls {
      background: #fff;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      min-height: 68px;
      padding: 14px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #startButton {
      background: #2563eb;
      color: white;
    }

    #stopButton {
      background: #ef4444;
      color: white;
    }

    #switchButton {
      background: #6b7280;
      color: white;
    }

    #againButton {
      width: 100%;
      margin-top: 18px;
      background: #16a34a;
      color: white;
    }

    @media (max-width: 650px) {

      body {
        padding: 10px;
      }

      .title {
        font-size: 26px;
      }

      .subtitle {
        font-size: 18px;
      }

      .branch {
        font-size: 14px;
      }

      #reader,
      #placeholder {
        min-height: 340px;
      }

      #placeholder {
        font-size: 19px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      #studentName {
        font-size: 28px;
      }

      #direction {
        font-size: 24px;
      }
    }

  </style>
</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="title">
      📷 Kumon Central Korat
    </div>

    <div class="subtitle">
      สแกน QR เข้า–ออก
    </div>

    <div class="branch">
      Branch: B001 | สาขาหลัก | Device: B001-01
    </div>

  </div>


  <!-- CAMERA -->

  <div class="camera-card">

    <div id="reader">

      <div id="placeholder">
        📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน
      </div>

      <div id="scanFrame">
        <div id="scanLine"></div>
      </div>

    </div>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status info"
  >
    พร้อมเปิดกล้อง
  </div>


  <!-- RESULT -->

  <div id="result">

    <div id="studentName">
      -
    </div>

    <div id="direction"></div>

    <div
      id="subject"
      class="result-line"
    ></div>

    <div
      id="time"
      class="result-line"
    ></div>

    <div
      id="duration"
      class="result-line"
    ></div>

    <div id="rawQR"></div>

    <button
      id="againButton"
      onclick="scanAgain()"
    >
      🔍 สแกนคนถัดไป
    </button>

  </div>


  <!-- BUTTONS -->

  <div class="controls">

    <button
      id="startButton"
      onclick="startCamera()"
    >
      📷 เปิดกล้อง
    </button>

    <button
      id="stopButton"
      onclick="stopCamera()"
      disabled
    >
      ⛔ ปิดกล้อง
    </button>

    <button
      id="switchButton"
      onclick="switchCamera()"
      disabled
    >
      🔄 สลับกล้อง
    </button>

  </div>

</div>



<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec";

const BRANCH_ID = "B001";

const DEVICE_ID = "B001-01";


/* =========================================================
   STATE
   ========================================================= */

let scanner = null;

let cameras = [];

let currentCameraIndex = 0;

let cameraRunning = false;

let cameraBusy = false;

let processing = false;

let scanLocked = false;

let lastQR = "";

let lastQRTime = 0;


/* =========================================================
   ELEMENTS
   ========================================================= */

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const studentNameBox =
  document.getElementById("studentName");

const directionBox =
  document.getElementById("direction");

const subjectBox =
  document.getElementById("subject");

const timeBox =
  document.getElementById("time");

const durationBox =
  document.getElementById("duration");

const rawQRBox =
  document.getElementById("rawQR");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const switchButton =
  document.getElementById("switchButton");

const placeholder =
  document.getElementById("placeholder");

const scanFrame =
  document.getElementById("scanFrame");


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  text,
  type = "info"
) {

  statusBox.textContent = text;

  statusBox.className =
    "status " + type;

}


/* =========================================================
   BUTTONS
   ========================================================= */

function updateButtons() {

  startButton.disabled =
    cameraRunning ||
    cameraBusy ||
    processing;

  stopButton.disabled =
    !cameraRunning ||
    cameraBusy;

  switchButton.disabled =
    !cameraRunning ||
    cameraBusy ||
    cameras.length < 2;

}


/* =========================================================
   SOUND
   ========================================================= */

function beep(
  success = true
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );

    oscillator.frequency.value =
      success ? 1000 : 400;

    gain.gain.value =
      0.15;

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.15
    );

  }

  catch (e) {

    console.log(e);

  }

}


/* =========================================================
   SCANNER CONFIG
   ========================================================= */

function scannerConfig() {

  return {

    fps: 10,

    qrbox:
      function(width, height) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.65
          );

        return {
          width:
            Math.min(size, 320),

          height:
            Math.min(size, 320)
        };

      },

    aspectRatio: 1.0

  };

}


/* =========================================================
   CREATE SCANNER
   ========================================================= */

function createScanner() {

  if (scanner) {
    return;
  }

  scanner =
    new Html5Qrcode(
      "reader"
    );

}


/* =========================================================
   GET CAMERAS
   ========================================================= */

async function loadCameras() {

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    throw new Error(
      "ไม่พบระบบอ่าน QR Code"
    );

  }


  cameras =
    await Html5Qrcode.getCameras();


  if (
    !Array.isArray(cameras) ||
    cameras.length === 0
  ) {

    throw new Error(
      "ไม่พบกล้องในอุปกรณ์"
    );

  }


  console.log(
    "CAMERAS:",
    cameras
  );


  return cameras;

}


/* =========================================================
   CHOOSE BACK CAMERA
   ========================================================= */

function chooseBackCamera(
  list
) {

  if (
    !list ||
    list.length === 0
  ) {

    return 0;

  }


  const backIndex =
    list.findIndex(
      camera =>
        /back|rear|environment|หลัง/i
          .test(
            camera.label || ""
          )
    );


  if (
    backIndex >= 0
  ) {

    return backIndex;

  }


  /*
   * ถ้าหาชื่อกล้องหลังไม่ได้
   * ใช้กล้องตัวสุดท้าย
   *
   * โดยเฉพาะ iPad/iPhone
   */

  return list.length - 1;

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  /*
   * สำคัญที่สุด
   *
   * ถ้ากำลังเปิด/ปิด/สลับ
   * ห้ามเรียกซ้ำ
   */

  if (
    cameraBusy ||
    cameraRunning ||
    processing
  ) {

    return;

  }


  cameraBusy = true;

  updateButtons();


  try {

    setStatus(
      "⏳ กำลังเตรียมกล้อง...",
      "loading"
    );


    /*
     * สร้าง scanner
     */

    createScanner();


    /*
     * ขอ permission และรายการกล้อง
     */

    await loadCameras();


    /*
     * เลือกกล้องหลัง
     */

    currentCameraIndex =
      chooseBackCamera(
        cameras
      );


    const cameraId =
      cameras[
        currentCameraIndex
      ].id;


    console.log(
      "START CAMERA:",
      cameraId
    );


    /*
     * =================================================
     * จุดสำคัญ
     *
     * START เพียงครั้งเดียว
     *
     * ไม่มี fallback start ซ้ำ
     * =================================================
     */

    await scanner.start(

      cameraId,

      scannerConfig(),

      onScanSuccess,

      function(errorMessage) {

        /*
         * ไม่ต้องแสดง error ทุก frame
         */

        console.log(
          "QR scan:",
          errorMessage
        );

      }

    );


    /*
     * start สำเร็จจริง
     */

    cameraRunning =
      true;

    scanLocked =
      false;

    placeholder.style.display =
      "none";

    scanFrame.style.display =
      "block";

    setStatus(
      "🟢 พร้อมสแกน QR",
      "success"
    );

  }

  catch(error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    cameraRunning =
      false;


    scanLocked =
      true;


    scanFrame.style.display =
      "none";


    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง";

    }


    if (
      /permission/i.test(message)
    ) {

      message =
        "ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาต Camera";

    }


    if (
      /transition/i.test(message)
    ) {

      message =
        "กล้องกำลังเปลี่ยนสถานะ กรุณารอ 1–2 วินาทีแล้วลองใหม่";

    }


    setStatus(
      "❌ เปิดกล้องไม่สำเร็จ: " +
      message,
      "error"
    );

  }

  finally {

    cameraBusy =
      false;

    updateButtons();

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

async function stopCamera() {

  if (
    cameraBusy ||
    !cameraRunning ||
    !scanner
  ) {

    return;

  }


  cameraBusy =
    true;


  updateButtons();


  try {

    setStatus(
      "⏳ กำลังปิดกล้อง...",
      "loading"
    );


    scanLocked =
      true;


    /*
     * รอ stop ให้เสร็จ
     * ก่อนเปลี่ยนสถานะ
     */

    await scanner.stop();


    cameraRunning =
      false;


    scanFrame.style.display =
      "none";


    placeholder.style.display =
      "flex";


    setStatus(
      "พร้อมเปิดกล้อง",
      "info"
    );

  }

  catch(error) {

    console.error(
      "STOP ERROR:",
      error
    );


    cameraRunning =
      false;


    scanFrame.style.display =
      "none";


    placeholder.style.display =
      "flex";


    setStatus(
      "พร้อมเปิดกล้อง",
      "info"
    );

  }

  finally {

    cameraBusy =
      false;

    updateButtons();

  }

}


/* =========================================================
   SWITCH CAMERA
   ========================================================= */

async function switchCamera() {

  if (
    cameraBusy ||
    !cameraRunning ||
    processing
  ) {

    return;

  }


  if (
    cameras.length < 2
  ) {

    setStatus(
      "ไม่พบกล้องมากกว่า 1 ตัว",
      "error"
    );

    return;

  }


  cameraBusy =
    true;


  updateButtons();


  try {

    setStatus(
      "⏳ กำลังสลับกล้อง...",
      "loading"
    );


    scanLocked =
      true;


    /*
     * STOP ตัวเดิมก่อน
     */

    await scanner.stop();


    cameraRunning =
      false;


    /*
     * เปลี่ยนกล้อง
     */

    currentCameraIndex =
      (
        currentCameraIndex + 1
      ) %
      cameras.length;


    const newCameraId =
      cameras[
        currentCameraIndex
      ].id;


    /*
     * START ใหม่
     */

    await scanner.start(

      newCameraId,

      scannerConfig(),

      onScanSuccess,

      function(errorMessage) {

        console.log(
          "QR scan:",
          errorMessage
        );

      }

    );


    cameraRunning =
      true;

    scanLocked =
      false;


    scanFrame.style.display =
      "block";


    setStatus(
      "🟢 สลับกล้องสำเร็จ",
      "success"
    );

  }

  catch(error) {

    console.error(
      "SWITCH CAMERA ERROR:",
      error
    );


    cameraRunning =
      false;

    scanLocked =
      true;


    scanFrame.style.display =
      "none";


    setStatus(
      "❌ สลับกล้องไม่สำเร็จ: " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }

  finally {

    cameraBusy =
      false;

    updateButtons();

  }

}


/* =========================================================
   APPS SCRIPT JSONP
   ========================================================= */

function callAppsScript(
  action,
  params = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "kumon_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 1000000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams();


      query.set(
        "action",
        action
      );

      query.set(
        "callback",
        callbackName
      );


      Object.keys(params)
        .forEach(
          function(key) {

            if (
              params[key] !== undefined &&
              params[key] !== null
            ) {

              query.set(
                key,
                params[key]
              );

            }

          }
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();

            reject(
              new Error(
                "Apps Script ไม่ตอบกลับภายใน 15 วินาที"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        }
        catch(e) {}


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (!response) {

            reject(
              new Error(
                "Apps Script ส่งข้อมูลว่างกลับมา"
              )
            );

            return;

          }


          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "เรียก Apps Script ไม่สำเร็จ"
            )
          );

        };


      script.async =
        true;


      script.src =
        API_URL +
        "?" +
        query.toString();


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   QR SUCCESS
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  if (
    !decodedText ||
    scanLocked ||
    processing ||
    cameraBusy
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * กัน QR เดิมอ่านซ้ำ
   */

  if (
    decodedText === lastQR &&
    now - lastQRTime < 3000
  ) {

    return;

  }


  lastQR =
    decodedText;

  lastQRTime =
    now;


  processing =
    true;

  scanLocked =
    true;


  updateButtons();


  beep(true);


  /*
   * =================================================
   * หยุดกล้องก่อนบันทึก
   * =================================================
   */

  if (
    scanner &&
    cameraRunning &&
    !cameraBusy
  ) {

    cameraBusy =
      true;


    try {

      await scanner.stop();

    }

    catch(e) {

      console.log(
        "Stop after QR:",
        e
      );

    }


    cameraRunning =
      false;

    cameraBusy =
      false;

  }


  scanFrame.style.display =
    "none";


  /*
   * =================================================
   * RESULT
   * =================================================
   */

  resultBox.style.display =
    "block";

  resultBox.className = "";


  studentNameBox.textContent =
    "กำลังบันทึกข้อมูล...";


  directionBox.textContent =
    "";

  subjectBox.textContent =
    "";

  timeBox.textContent =
    "";

  durationBox.textContent =
    "";


  rawQRBox.textContent =
    "QR: " +
    decodedText;


  setStatus(
    "⏳ อ่าน QR แล้ว — กำลังบันทึกข้อมูล...",
    "loading"
  );


  try {

    const response =
      await callAppsScript(

        "scan",

        {

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID,

          payload:
            decodedText

        }

      );


    if (
      !response ||
      response.success !== true
    ) {

      throw new Error(

        response &&
        (
          response.error ||
          response.message
        )
          ? (
              response.error ||
              response.message
            )
          : "Apps Script ไม่สามารถบันทึกข้อมูลได้"

      );

    }


    studentNameBox.textContent =
      response.fullName ||
      response.studentName ||
      response.studentId ||
      "-";


    if (
      response.direction ===
      "IN"
    ) {

      directionBox.textContent =
        "🟢 เข้าเรียนสำเร็จ";

    }

    else if (
      response.direction ===
      "OUT"
    ) {

      directionBox.textContent =
        "🔴 ออกจากห้องเรียนสำเร็จ";

    }

    else {

      directionBox.textContent =
        response.direction ||
        "บันทึกสำเร็จ";

    }


    subjectBox.textContent =
      "📚 วิชา: " +
      (
        response.subject ||
        "-"
      );


    timeBox.textContent =
      "🕐 เวลา: " +
      (
        response.time ||
        "-"
      );


    if (
      response.durationMin !== undefined &&
      response.durationMin !== null &&
      response.durationMin !== ""
    ) {

      durationBox.textContent =
        "⏱ เวลาเรียน: " +
        response.durationMin +
        " นาที";

    }


    resultBox.className =
      "success-result";


    setStatus(
      response.message ||
      "✅ บันทึกข้อมูลสำเร็จ",
      "success"
    );


    beep(true);

  }

  catch(error) {

    console.error(
      "SCAN ERROR:",
      error
    );


    resultBox.className =
      "error-result";


    studentNameBox.textContent =
      "❌ บันทึกข้อมูลไม่สำเร็จ";


    setStatus(
      "❌ " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );


    beep(false);

  }


  processing =
    false;


  scanLocked =
    true;


  updateButtons();

}


/* =========================================================
   SCAN AGAIN
   ========================================================= */

async function scanAgain() {

  if (
    processing ||
    cameraBusy
  ) {

    return;

  }


  resultBox.style.display =
    "none";


  resultBox.className = "";


  lastQR =
    "";

  lastQRTime =
    0;


  scanLocked =
    false;


  setStatus(
    "พร้อมเปิดกล้อง",
    "info"
  );


  /*
   * เปิดกล้องใหม่
   */

  await startCamera();

}


/* =========================================================
   INITIAL
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    setStatus(
      "พร้อมเปิดกล้อง",
      "info"
    );


    updateButtons();

  }
);


/* =========================================================
   PAGE CLOSE
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      cameraRunning
    ) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>

</body>

</html>
