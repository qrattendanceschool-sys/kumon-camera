<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Kumon QR Attendance</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f5f5f5;
}

.container {
  max-width: 700px;
  margin: auto;
}

.header {
  background: white;

  border-radius: 16px;

  padding: 18px;

  text-align: center;

  margin-bottom: 16px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);
}

.header h1 {
  margin: 0;

  font-size: 22px;
}

.header p {
  margin: 6px 0 0;

  color: #666;
}

.card {
  background: white;

  border-radius: 16px;

  padding: 16px;

  margin-bottom: 16px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);
}

#reader {
  width: 100%;
}

.status {
  padding: 15px;

  border-radius: 12px;

  text-align: center;

  font-size: 18px;

  font-weight: 700;

  background: #f3f4f6;

  margin-bottom: 12px;
}

.status.success {
  background: #dcfce7;

  color: #166534;
}

.status.error {
  background: #fee2e2;

  color: #991b1b;
}

.status.loading {
  background: #fef3c7;

  color: #92400e;
}

.result {
  display: none;

  padding: 18px;

  border-radius: 12px;

  background: #f8fafc;
}

.result .name {
  font-size: 24px;

  font-weight: 800;

  margin-bottom: 8px;
}

.result .line {
  font-size: 17px;

  margin: 5px 0;
}

.result .direction {
  font-size: 28px;

  font-weight: 900;

  margin: 12px 0;
}

.buttons {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

button {
  border: 0;

  border-radius: 12px;

  padding: 14px;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;
}

.start {
  background: #2563eb;

  color: white;
}

.stop {
  background: #dc2626;

  color: white;
}

.again {
  width: 100%;

  background: #16a34a;

  color: white;

  margin-top: 12px;
}

.raw {
  margin-top: 12px;

  padding: 10px;

  border-radius: 8px;

  background: #f3f4f6;

  word-break: break-all;

  font-size: 13px;

  color: #555;
}

</style>

</head>


<body>


<div class="container">


  <!-- ==================================================
       HEADER
  ================================================== -->

  <div class="header">

    <h1>
      QR Attendance
    </h1>

    <p>
      สแกน QR เข้า–ออก
    </p>

  </div>


  <!-- ==================================================
       CAMERA
  ================================================== -->

  <div class="card">

    <div
      id="reader"
    ></div>

  </div>


  <!-- ==================================================
       STATUS
  ================================================== -->

  <div
    id="status"
    class="status"
  >

    พร้อมเปิดกล้อง

  </div>


  <!-- ==================================================
       RESULT
  ================================================== -->

  <div
    id="result"
    class="result"
  >

    <div
      id="studentName"
      class="name"
    ></div>

    <div
      id="direction"
      class="direction"
    ></div>

    <div
      id="subject"
      class="line"
    ></div>

    <div
      id="time"
      class="line"
    ></div>

    <div
      id="duration"
      class="line"
    ></div>

    <div
      id="raw"
      class="raw"
    ></div>

    <button
      class="again"
      onclick="scanAgain()"
    >
      🔍 สแกนคนถัดไป
    </button>

  </div>


  <!-- ==================================================
       BUTTONS
  ================================================== -->

  <div class="card">

    <div class="buttons">

      <button
        class="start"
        onclick="startScanner()"
      >
        📷 เปิดกล้อง
      </button>

      <button
        class="stop"
        onclick="stopScanner()"
      >
        ⛔ ปิดกล้อง
      </button>

    </div>

  </div>


</div>


<!-- ====================================================
     JAVASCRIPT
==================================================== -->

<script>


/* ======================================================
   APPS SCRIPT URL
====================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec';


/* ======================================================
   BRANCH / DEVICE
====================================================== */

const BRANCH_ID =
  'B001';


const DEVICE_ID =
  'B001-01';


/* ======================================================
   GLOBAL
====================================================== */

let scanner = null;

let scanning = false;

let processing = false;

let lastQR = '';

let lastQRTime = 0;


/* ======================================================
   ELEMENTS
====================================================== */

const statusBox =
  document.getElementById(
    'status'
  );

const resultBox =
  document.getElementById(
    'result'
  );

const studentName =
  document.getElementById(
    'studentName'
  );

const directionBox =
  document.getElementById(
    'direction'
  );

const subjectBox =
  document.getElementById(
    'subject'
  );

const timeBox =
  document.getElementById(
    'time'
  );

const durationBox =
  document.getElementById(
    'duration'
  );

const rawBox =
  document.getElementById(
    'raw'
  );


/* ======================================================
   STATUS
====================================================== */

function setStatus(
  text,
  type = ''
) {

  statusBox.textContent =
    text;

  statusBox.className =
    'status';

  if (type) {

    statusBox.classList.add(
      type
    );

  }

}


/* ======================================================
   ESCAPE
====================================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* ======================================================
   SOUND
====================================================== */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.connect(
      gain
    );

    gain.connect(
      audio.destination
    );

    oscillator.frequency.value =
      1000;

    gain.gain.value =
      0.15;

    oscillator.start();

    oscillator.stop(
      audio.currentTime +
      0.12
    );

  }

  catch (e) {

    console.log(
      'beep error',
      e
    );

  }

}


/* ======================================================
   API CALL
====================================================== */

function callAPI(
  action,
  params = {}
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callbackName =
        'apiCallback_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object.keys(
        params
      ).forEach(
        key => {

          const value =
            params[key];

          if (
            value !== undefined &&
            value !== null
          ) {

            query.set(
              key,
              String(value)
            );

          }

        }
      );


      let finished =
        false;


      const timeout =
        setTimeout(
          () => {

            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();

            reject(
              new Error(
                'Apps Script ไม่ตอบกลับภายในเวลาที่กำหนด'
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );

        try {

          delete window[
            callbackName
          ];

        }

        catch (e) {}

        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {
            return;
          }

          finished =
            true;

          cleanup();


          if (
            !response ||
            response.success !== true
          ) {

            reject(
              new Error(
                response &&
                response.error

                  ? response.error

                  : 'Apps Script Error'
              )
            );

            return;

          }


          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished =
            true;

          cleanup();

          reject(
            new Error(
              'เชื่อมต่อ Apps Script ไม่สำเร็จ'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        query.toString();


      document.head.appendChild(
        script
      );

    }
  );

}


/* ======================================================
   START CAMERA
====================================================== */

async function startScanner() {

  if (scanning) {

    return;

  }


  try {

    setStatus(
      'กำลังเปิดกล้อง...',
      'loading'
    );


    if (!scanner) {

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'ไม่พบกล้องในอุปกรณ์'
      );

    }


    let cameraId =
      cameras[0].id;


    const backCamera =
      cameras.find(
        camera =>
          /back|rear|environment/i
            .test(
              camera.label || ''
            )
      );


    if (backCamera) {

      cameraId =
        backCamera.id;

    }


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      () => {}

    );


    scanning =
      true;


    setStatus(
      '🟢 พร้อมสแกน QR',
      'success'
    );

  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      '❌ เปิดกล้องไม่สำเร็จ: ' +
      (
        error.message ||
        error
      ),
      'error'
    );

  }

}


/* ======================================================
   STOP CAMERA
====================================================== */

async function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {

    await scanner.stop();

  }

  catch (e) {

    console.log(
      'stop error',
      e
    );

  }


  scanning =
    false;

}


/* ======================================================
   QR SUCCESS
====================================================== */

async function onScanSuccess(
  decodedText
) {

  if (processing) {

    return;

  }


  const now =
    Date.now();


  /*
   * ป้องกัน QR เดิมยิงซ้ำ
   */

  if (
    decodedText === lastQR &&
    now - lastQRTime < 3000
  ) {

    return;

  }


  lastQR =
    decodedText;


  lastQRTime =
    now;


  processing =
    true;


  /*
   * หยุดกล้อง
   */

  await stopScanner();


  /*
   * แสดงกำลังตรวจสอบ
   */

  resultBox.style.display =
    'none';


  setStatus(
    '⏳ อ่าน QR แล้ว — กำลังตรวจสอบ...',
    'loading'
  );


  try {


    /*
     * ส่ง QR ไป Apps Script
     */

    const response =
      await callAPI(

        'scan',

        {

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID,

          payload:
            decodedText

        }

      );
const data =
  response;

if (!data) {
  throw new Error(
    'Apps Script ไม่ส่งข้อมูลกลับมา'
  );
}

    const data =
      response;


    if (!data) {

      throw new Error(
        'Apps Script ไม่ส่งข้อมูลกลับมา'
      );

    }


    /*
     * เสียง
     */

    beep();


    /*
     * แสดงชื่อ
     */

    studentName.textContent =
      data.fullName ||
      data.studentId ||
      '-';


    /*
     * IN / OUT
     */

    directionBox.textContent =
      data.direction === 'IN'

        ? '🟢 CHECK-IN'

        : '🔴 CHECK-OUT';


    /*
     * วิชา
     */

    subjectBox.textContent =
      'วิชา: ' +
      (
        data.subject ||
        '-'
      );


    /*
     * เวลา
     */

    timeBox.textContent =
      'เวลา: ' +
      (
        data.time ||
        '-'
      );


    /*
     * ระยะเวลา
     */

    if (
      data.durationMin !== '' &&
      data.durationMin !== null &&
      data.durationMin !== undefined
    ) {

      durationBox.textContent =
        'เวลาเรียน: ' +
        data.durationMin +
        ' นาที';

    }

    else {

      durationBox.textContent =
        '';

    }


    /*
     * QR ดิบ
     */

    rawBox.textContent =
      'QR: ' +
      decodedText;


    /*
     * แสดงผล
     */

    resultBox.style.display =
      'block';


    setStatus(

      data.message ||
      (
        data.direction === 'IN'
          ? 'เช็กอินสำเร็จ'
          : 'เช็กเอาต์สำเร็จ'
      ),

      'success'

    );


  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      '❌ ' +
      (
        error.message ||
        error
      ),
      'error'
    );


    resultBox.style.display =
      'block';


    studentName.textContent =
      'ไม่สามารถบันทึกข้อมูลได้';


    directionBox.textContent =
      '';


    subjectBox.textContent =
      '';


    timeBox.textContent =
      '';


    durationBox.textContent =
      '';


    rawBox.textContent =
      'QR: ' +
      decodedText;

  }


  processing =
    false;

}


/* ======================================================
   SCAN AGAIN
====================================================== */

async function scanAgain() {

  resultBox.style.display =
    'none';


  lastQR =
    '';


  lastQRTime =
    0;


  await startScanner();

}


/* ======================================================
   PAGE LOAD
====================================================== */

window.addEventListener(
  'load',
  function() {

    setStatus(
      'พร้อมเปิดกล้อง'
    );

  }
);


</script>

</body>

</html>
