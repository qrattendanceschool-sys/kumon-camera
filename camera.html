<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec";


const BRANCH_ID =
  "B001";


const DEVICE_ID =
  "B001-01";


/* =========================================================
   GLOBAL STATE
   ========================================================= */


/*
 * ตัว scanner หลัก
 */

let scanner = null;


/*
 * กล้องกำลังเปิดอยู่หรือไม่
 */

let cameraRunning = false;


/*
 * สำคัญมาก
 *
 * ป้องกัน start / stop / switch
 * ทำงานพร้อมกัน
 */

let cameraTransitioning = false;


/*
 * กำลังส่ง QR ไป Apps Script
 */

let processing = false;


/*
 * รายการกล้อง
 */

let cameras = [];


/*
 * กล้องปัจจุบัน
 */

let currentCameraIndex = 0;


/*
 * QR ล่าสุด
 */

let lastQR = "";


/*
 * เวลาที่อ่าน QR ล่าสุด
 */

let lastQRTime = 0;


/*
 * ป้องกัน callback scanner
 * ยิงเข้ามาซ้ำในช่วง transition
 */

let scanLocked = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const reader =
  document.getElementById("reader");


const statusBox =
  document.getElementById("status");


const resultBox =
  document.getElementById("result");


const studentNameBox =
  document.getElementById("studentName");


const directionBox =
  document.getElementById("direction");


const subjectBox =
  document.getElementById("subject");


const timeBox =
  document.getElementById("time");


const durationBox =
  document.getElementById("duration");


const rawQRBox =
  document.getElementById("rawQR");


const startButton =
  document.getElementById("startButton");


const stopButton =
  document.getElementById("stopButton");


const switchButton =
  document.getElementById("switchButton");


const scanFrame =
  document.getElementById("scanFrame");


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  text,
  type = "info"
) {

  statusBox.textContent =
    text;

  statusBox.className =
    "status " + type;

}


/* =========================================================
   BUTTON STATE
   ========================================================= */

function updateButtons() {

  startButton.disabled =
    cameraRunning ||
    cameraTransitioning ||
    processing;


  stopButton.disabled =
    !cameraRunning ||
    cameraTransitioning;


  switchButton.disabled =
    !cameraRunning ||
    cameraTransitioning ||
    cameras.length < 2;

}


/* =========================================================
   SOUND
   ========================================================= */

function beep(
  success = true
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );


    oscillator.frequency.value =
      success
        ? 1000
        : 400;


    gain.gain.value =
      0.15;


    oscillator.start();


    oscillator.stop(
      audio.currentTime + 0.15
    );

  }

  catch(error) {

    console.log(
      "Audio error:",
      error
    );

  }

}


/* =========================================================
   SCANNER CONFIG
   ========================================================= */

function getScannerConfig() {

  return {

    fps: 10,

    qrbox:
      function(width, height) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.65
          );


        return {

          width:
            Math.min(
              size,
              320
            ),

          height:
            Math.min(
              size,
              320
            )

        };

      },

    aspectRatio: 1.0

  };

}


/* =========================================================
   CREATE SCANNER
   ========================================================= */

function createScanner() {

  if (scanner) {

    return scanner;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  return scanner;

}


/* =========================================================
   GET CAMERAS
   ========================================================= */

async function getAvailableCameras() {

  try {

    const list =
      await Html5Qrcode.getCameras();


    if (
      Array.isArray(list)
    ) {

      cameras =
        list;

    }
    else {

      cameras =
        [];

    }


    return cameras;

  }

  catch(error) {

    console.error(
      "GET CAMERAS ERROR:",
      error
    );


    cameras = [];


    return [];

  }

}


/* =========================================================
   FIND BACK CAMERA
   ========================================================= */

function findBackCameraIndex(
  list
) {

  if (
    !list ||
    list.length === 0
  ) {

    return 0;

  }


  const index =
    list.findIndex(
      function(camera) {

        return /back|rear|environment|หลัง/i
          .test(
            camera.label || ""
          );

      }
    );


  if (index >= 0) {

    return index;

  }


  /*
   * ถ้าหาไม่เจอ
   * ใช้ตัวแรก
   */

  return 0;

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  /*
   * กันกดซ้ำ
   */

  if (
    cameraRunning ||
    cameraTransitioning ||
    processing
  ) {

    return;

  }


  /*
   * LOCK
   */

  cameraTransitioning =
    true;


  updateButtons();


  try {

    if (
      typeof Html5Qrcode ===
      "undefined"
    ) {

      throw new Error(
        "ไม่พบระบบอ่าน QR Code"
      );

    }


    setStatus(
      "⏳ กำลังเปิดกล้อง...",
      "loading"
    );


    scanLocked =
      false;


    /*
     * สร้าง scanner เพียงครั้งเดียว
     */

    if (!scanner) {

      createScanner();

    }


    /*
     * =================================================
     * วิธีที่ 1
     * ใช้กล้องหลังโดยตรง
     * =================================================
     */

    try {

      await scanner.start(

        {
          facingMode: {
            ideal: "environment"
          }
        },

        getScannerConfig(),

        onScanSuccess,

        function() {}

      );


      /*
       * สำเร็จ
       */

      cameraRunning =
        true;


      /*
       * ขอรายการกล้องหลังจาก permission
       */

      await getAvailableCameras();


      if (
        cameras.length > 0
      ) {

        currentCameraIndex =
          findBackCameraIndex(
            cameras
          );

      }


    }

    catch(firstError) {

      console.log(
        "Environment camera failed:",
        firstError
      );


      /*
       * =================================================
       * วิธีที่ 2
       * ใช้ Camera ID
       * =================================================
       */

      cameras =
        await getAvailableCameras();


      if (
        cameras.length === 0
      ) {

        throw firstError;

      }


      currentCameraIndex =
        findBackCameraIndex(
          cameras
        );


      const cameraId =
        cameras[
          currentCameraIndex
        ].id;


      await scanner.start(

        cameraId,

        getScannerConfig(),

        onScanSuccess,

        function() {}

      );


      cameraRunning =
        true;

    }


    /*
     * เปิดกรอบสแกน
     */

    scanFrame.style.display =
      "block";


    setStatus(
      "🟢 พร้อมสแกน QR",
      "success"
    );

  }

  catch(error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    cameraRunning =
      false;


    scanFrame.style.display =
      "none";


    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    /*
     * แปลงข้อความที่พบบ่อย
     */

    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาต Camera";

    }


    if (
      /already under transition/i
        .test(message)
    ) {

      message =
        "กล้องกำลังเปลี่ยนสถานะ กรุณารอสักครู่แล้วลองใหม่";

    }


    setStatus(
      "❌ เปิดกล้องไม่สำเร็จ: " +
      message,
      "error"
    );

  }

  finally {

    cameraTransitioning =
      false;


    updateButtons();

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

async function stopCamera() {

  /*
   * ถ้ากำลัง transition อยู่
   * ห้าม stop ซ้อน
   */

  if (
    cameraTransitioning
  ) {

    return;

  }


  if (
    !scanner ||
    !cameraRunning
  ) {

    cameraRunning =
      false;

    updateButtons();

    return;

  }


  cameraTransitioning =
    true;


  updateButtons();


  try {

    setStatus(
      "⏳ กำลังปิดกล้อง...",
      "loading"
    );


    /*
     * ล็อก callback QR
     */

    scanLocked =
      true;


    /*
     * สำคัญ:
     * รอ scanner.stop() ให้เสร็จ
     * ก่อนเปลี่ยน state
     */

    await scanner.stop();


    cameraRunning =
      false;


    scanFrame.style.display =
      "none";


    setStatus(
      "พร้อมเปิดกล้อง",
      "info"
    );

  }

  catch(error) {

    console.error(
      "STOP CAMERA ERROR:",
      error
    );


    /*
     * ไม่เรียก clear()
     * เพราะอาจทำให้ state ชนกัน
     */

    cameraRunning =
      false;


    scanFrame.style.display =
      "none";


    setStatus(
      "พร้อมเปิดกล้อง",
      "info"
    );

  }

  finally {

    cameraTransitioning =
      false;


    updateButtons();

  }

}


/* =========================================================
   SWITCH CAMERA
   ========================================================= */

async function switchCamera() {

  if (
    !cameraRunning ||
    cameraTransitioning ||
    processing
  ) {

    return;

  }


  if (
    !cameras ||
    cameras.length < 2
  ) {

    await getAvailableCameras();

  }


  if (
    cameras.length < 2
  ) {

    setStatus(
      "พบกล้องเพียง 1 ตัว",
      "error"
    );

    return;

  }


  cameraTransitioning =
    true;


  updateButtons();


  try {

    setStatus(
      "⏳ กำลังสลับกล้อง...",
      "loading"
    );


    /*
     * หยุด callback QR
     */

    scanLocked =
      true;


    /*
     * STOP
     */

    await scanner.stop();


    cameraRunning =
      false;


    /*
     * เปลี่ยน index
     */

    currentCameraIndex =
      (
        currentCameraIndex + 1
      ) %
      cameras.length;


    const cameraId =
      cameras[
        currentCameraIndex
      ].id;


    /*
     * START กล้องใหม่
     */

    await scanner.start(

      cameraId,

      getScannerConfig(),

      onScanSuccess,

      function() {}

    );


    cameraRunning =
      true;


    scanLocked =
      false;


    scanFrame.style.display =
      "block";


    setStatus(
      "🟢 สลับกล้องสำเร็จ",
      "success"
    );

  }

  catch(error) {

    console.error(
      "SWITCH CAMERA ERROR:",
      error
    );


    cameraRunning =
      false;


    scanLocked =
      false;


    scanFrame.style.display =
      "none";


    setStatus(
      "❌ สลับกล้องไม่สำเร็จ: " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }

  finally {

    cameraTransitioning =
      false;


    updateButtons();

  }

}


/* =========================================================
   APPS SCRIPT JSONP
   ========================================================= */

function callAppsScript(
  action,
  params = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "kumon_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 1000000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams();


      query.set(
        "action",
        action
      );


      query.set(
        "callback",
        callbackName
      );


      Object.keys(params)
        .forEach(
          function(key) {

            const value =
              params[key];


            if (
              value !== undefined &&
              value !== null
            ) {

              query.set(
                key,
                value
              );

            }

          }
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {

              return;

            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "Apps Script ไม่ตอบกลับภายใน 15 วินาที"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        }

        catch(e) {}


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          if (!response) {

            reject(
              new Error(
                "Apps Script ส่งข้อมูลว่างกลับมา"
              )
            );

            return;

          }


          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "เรียก Apps Script ไม่สำเร็จ"
            )
          );

        };


      script.async =
        true;


      script.src =
        API_URL +
        "?" +
        query.toString();


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   QR SUCCESS
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  /*
   * ถ้ากำลัง transition
   * ไม่รับ QR
   */

  if (
    !decodedText ||
    processing ||
    cameraTransitioning ||
    scanLocked
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * ป้องกัน QR เดิมยิงซ้ำ
   */

  if (
    decodedText === lastQR &&
    now - lastQRTime < 3000
  ) {

    return;

  }


  lastQR =
    decodedText;


  lastQRTime =
    now;


  processing =
    true;


  updateButtons();


  /*
   * =================================================
   * อ่าน QR สำเร็จ
   * =================================================
   */

  beep(true);


  /*
   * ล็อก QR ทันที
   */

  scanLocked =
    true;


  /*
   * หยุดกล้องก่อน
   */

  if (
    scanner &&
    cameraRunning &&
    !cameraTransitioning
  ) {

    /*
     * เราเรียก stopCamera()
     * และรอให้เสร็จจริง
     */

    await stopCamera();

  }


  /*
   * =================================================
   * แสดงผล
   * =================================================
   */

  resultBox.style.display =
    "block";


  resultBox.className =
    "";


  studentNameBox.textContent =
    "กำลังบันทึกข้อมูล...";


  directionBox.textContent =
    "";


  subjectBox.textContent =
    "";


  timeBox.textContent =
    "";


  durationBox.textContent =
    "";


  rawQRBox.textContent =
    "QR: " +
    decodedText;


  setStatus(
    "⏳ อ่าน QR แล้ว — กำลังบันทึกข้อมูล...",
    "loading"
  );


  try {

    /*
     * =================================================
     * ส่งไป Apps Script
     * =================================================
     */

    const response =
      await callAppsScript(

        "scan",

        {

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID,

          payload:
            decodedText

        }

      );


    /*
     * ตรวจผลลัพธ์
     */

    if (
      !response ||
      response.success !== true
    ) {

      throw new Error(

        response &&
        (
          response.error ||
          response.message
        )
          ? (
              response.error ||
              response.message
            )
          : "Apps Script ไม่สามารถบันทึกข้อมูลได้"

      );

    }


    /*
     * =================================================
     * ชื่อนักเรียน
     * =================================================
     */

    studentNameBox.textContent =
      response.fullName ||
      response.studentName ||
      response.studentId ||
      "-";


    /*
     * =================================================
     * IN / OUT
     * =================================================
     */

    if (
      response.direction ===
      "IN"
    ) {

      directionBox.textContent =
        "🟢 เข้าเรียนสำเร็จ";

    }

    else if (
      response.direction ===
      "OUT"
    ) {

      directionBox.textContent =
        "🔴 ออกจากห้องเรียนสำเร็จ";

    }

    else {

      directionBox.textContent =
        response.direction ||
        "บันทึกสำเร็จ";

    }


    /*
     * =================================================
     * SUBJECT
     * =================================================
     */

    subjectBox.textContent =
      "📚 วิชา: " +
      (
        response.subject ||
        "-"
      );


    /*
     * =================================================
     * TIME
     * =================================================
     */

    timeBox.textContent =
      "🕐 เวลา: " +
      (
        response.time ||
        "-"
      );


    /*
     * =================================================
     * DURATION
     * =================================================
     */

    if (
      response.durationMin !== undefined &&
      response.durationMin !== null &&
      response.durationMin !== ""
    ) {

      durationBox.textContent =
        "⏱ เวลาเรียน: " +
        response.durationMin +
        " นาที";

    }


    /*
     * =================================================
     * SUCCESS
     * =================================================
     */

    resultBox.className =
      "success";


    setStatus(

      response.message ||
      "✅ บันทึกข้อมูลสำเร็จ",

      "success"

    );


    beep(true);

  }

  catch(error) {

    console.error(
      "SCAN ERROR:",
      error
    );


    resultBox.className =
      "error";


    studentNameBox.textContent =
      "❌ บันทึกข้อมูลไม่สำเร็จ";


    directionBox.textContent =
      "";


    subjectBox.textContent =
      "";


    timeBox.textContent =
      "";


    durationBox.textContent =
      "";


    rawQRBox.textContent =
      "QR: " +
      decodedText;


    setStatus(

      "❌ " +
      (
        error.message ||
        String(error)
      ),

      "error"

    );


    beep(false);

  }


  /*
   * เสร็จแล้ว
   */

  processing =
    false;


  /*
   * ปลดล็อกสำหรับปุ่มสแกนคนถัดไป
   */

  scanLocked =
    false;


  updateButtons();

}


/* =========================================================
   SCAN AGAIN
   ========================================================= */

async function scanAgain() {

  if (
    processing ||
    cameraTransitioning
  ) {

    return;

  }


  resultBox.style.display =
    "none";


  resultBox.className =
    "";


  lastQR =
    "";


  lastQRTime =
    0;


  scanLocked =
    false;


  setStatus(
    "พร้อมเปิดกล้อง",
    "info"
  );


  /*
   * เปิดกล้องใหม่
   */

  await startCamera();

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    /*
     * ไม่ ping Apps Script ตอนเปิดหน้า
     *
     * Backend เราทดสอบแล้วว่าใช้งานได้
     */

    setStatus(
      "พร้อมเปิดกล้อง",
      "info"
    );


    updateButtons();

  }
);


/* =========================================================
   PAGE CLOSE
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      cameraRunning
    ) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>
