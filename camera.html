<script>
window.addEventListener("error", function(e) {

  if (
    !window.Html5Qrcode &&
    e.target &&
    e.target.tagName === "SCRIPT"
  ) {

    const s =
      document.createElement("script");

    s.src =
      "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";

    document.head.appendChild(s);

  }

}, true);
</script>

   RESULT

  padding: 20px;

  background: #f8fafc;

}


.result.error {

}


.student-name {

}

<script>


/* =====================================================
   CONFIG
   ===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyuISi-DgYLz_gGi0bqFybq0l6pIpXxS9xTkDdy8YnF7EIofZYjc3B9eZEgFiPwXAVR/exec';


const BRANCH_ID =
  'B001';


const DEVICE_ID =
  'B001-01';


/* =====================================================
   GLOBAL
   ===================================================== */

let scanner = null;

let cameras = [];

let currentCameraIndex = 0;

let cameraRunning = false;

let processing = false;

let lastQR = '';

let lastQRTime = 0;


/* =====================================================
   ELEMENTS
   ===================================================== */

const reader =
  document.getElementById('reader');


const statusBox =
  document.getElementById('status');


const resultBox =
  document.getElementById('result');


const studentName =
  document.getElementById('studentName');


const directionBox =
  document.getElementById('direction');


const subjectBox =
  document.getElementById('subject');


const timeBox =
  document.getElementById('time');


const durationBox =
  document.getElementById('duration');


const rawBox =
  document.getElementById('raw');


const scanFrame =
  document.getElementById('scanFrame');


const startButton =
  document.getElementById('startButton');


const stopButton =
  document.getElementById('stopButton');


const switchButton =
  document.getElementById('switchButton');


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
  text,
  type = 'info'
) {

  statusBox.textContent =
    text;

  statusBox.className =
    'status ' + type;

}


/* =====================================================
   BUTTONS
   ===================================================== */

function updateButtons() {

  startButton.disabled =
    cameraRunning ||
    processing;

  stopButton.disabled =
    !cameraRunning;

  switchButton.disabled =
    !cameraRunning ||
    cameras.length < 2;

}


/* =====================================================
   SOUND
   ===================================================== */

function beep(
  success = true
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );


    oscillator.frequency.value =
      success
        ? 1000
        : 450;


    gain.gain.value =
      0.15;


    oscillator.start();


    oscillator.stop(
      audio.currentTime + 0.12
    );


  } catch(error) {

    console.log(error);

  }

}


/* =====================================================
   CAMERA
   ===================================================== */

async function startCamera() {

  if (cameraRunning || processing) {
    return;
  }


  try {

    if (typeof Html5Qrcode === 'undefined') {

      throw new Error(
        'ไม่พบระบบ QR Scanner — กรุณารีเฟรชหน้าเว็บ'
      );

    }


    setStatus(
      '⏳ กำลังเปิดกล้อง...',
      'loading'
    );


    /*
     * สร้าง scanner
     */

    if (!scanner) {

      reader.innerHTML = '';

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }
    else {

      reader.innerHTML = '';

    }


    /*
     * Configuration
     */

    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.65
          );


        return {

          width:
            Math.min(
              size,
              320
            ),

          height:
            Math.min(
              size,
              320
            )

        };

      },

      aspectRatio: 1.0

    };


    /*
     * ขั้นแรก:
     * พยายามเปิดกล้องหลัง
     */

    try {

      await scanner.start(

        {
          facingMode: {
            exact: 'environment'
          }
        },

        config,

        onScanSuccess,

        function() {}

      );

    }


    /*
     * ถ้าเปิดกล้องหลังไม่ได้
     * ให้ค้นหารายการกล้อง
     */

    catch(environmentError) {

      console.warn(
        'Environment camera failed:',
        environmentError
      );


      cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          'ไม่พบกล้องในอุปกรณ์'
        );

      }


      let backIndex =
        cameras.findIndex(
          function(camera) {

            return /back|rear|environment|หลัง/i
              .test(
                camera.label || ''
              );

          }
        );


      if (backIndex < 0) {

        backIndex = 0;

      }


      currentCameraIndex =
        backIndex;


      await scanner.start(

        cameras[
          currentCameraIndex
        ].id,

        config,

        onScanSuccess,

        function() {}

      );

    }


    cameraRunning =
      true;


    scanFrame.style.display =
      'block';


    /*
     * หลัง permission แล้ว
     * ขอรายการกล้องอีกครั้ง
     */

    try {

      cameras =
        await Html5Qrcode.getCameras();


      const backIndex =
        cameras.findIndex(
          function(camera) {

            return /back|rear|environment|หลัง/i
              .test(
                camera.label || ''
              );

          }
        );


      if (backIndex >= 0) {

        currentCameraIndex =
          backIndex;

      }

    }
    catch(e) {

      console.warn(
        'อ่านรายการกล้องไม่ได้:',
        e
      );

    }


    setStatus(
      '🟢 พร้อมสแกน QR',
      'success'
    );


    updateButtons();


  }
  catch(error) {

    console.error(
      'Camera error:',
      error
    );


    cameraRunning =
      false;


    scanFrame.style.display =
      'none';


    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    if (
      error &&
      error.name ===
      'NotAllowedError'
    ) {

      message =
        'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาต Camera ใน Safari';

    }


    else if (
      error &&
      error.name ===
      'NotFoundError'
    ) {

      message =
        'ไม่พบกล้องในอุปกรณ์';

    }


    else if (
      error &&
      error.name ===
      'NotReadableError'
    ) {

      message =
        'กล้องกำลังถูกใช้งานโดยแอปอื่น';

    }


    setStatus(
      '❌ เปิดกล้องไม่สำเร็จ: ' +
      message,
      'error'
    );


    updateButtons();

  }

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

async function stopCamera() {

  if (!scanner) {

    cameraRunning =
      false;

    updateButtons();

    return;

  }


  try {

    if (cameraRunning) {

      await scanner.stop();

    }

  }
  catch(error) {

    console.log(
      'stop error:',
      error
    );

  }


  cameraRunning =
    false;


  scanFrame.style.display =
    'none';


  reader.innerHTML =
    `
    <div class="camera-placeholder">
      📷 กด "เปิดกล้อง"
      เพื่อเริ่มสแกน
    </div>
    `;


  setStatus(
    'พร้อมเปิดกล้อง',
    'info'
  );


  updateButtons();

}


/* =====================================================
   SWITCH CAMERA
   ===================================================== */

async function switchCamera() {

  if (
    processing ||
    !scanner
  ) {

    return;

  }


  try {

    setStatus(
      '⏳ กำลังสลับกล้อง...',
      'loading'
    );


    if (cameraRunning) {

      await scanner.stop();

      cameraRunning =
        false;

    }


    cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length < 2
    ) {

      throw new Error(
        'อุปกรณ์นี้พบกล้องเพียง 1 ตัว'
      );

    }


    currentCameraIndex =
      (
        currentCameraIndex + 1
      ) %
      cameras.length;


    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.65
          );


        return {

          width:
            Math.min(
              size,
              320
            ),

          height:
            Math.min(
              size,
              320
            )

        };

      },

      aspectRatio: 1.0

    };


    await scanner.start(

      cameras[
        currentCameraIndex
      ].id,

      config,

      onScanSuccess,

      function() {}

    );


    cameraRunning =
      true;


    scanFrame.style.display =
      'block';


    setStatus(
      '🟢 สลับกล้องสำเร็จ — พร้อมสแกน QR',
      'success'
    );


    updateButtons();


  }
  catch(error) {

    console.error(
      'Switch camera error:',
      error
    );


    cameraRunning =
      false;


    scanFrame.style.display =
      'none';


    setStatus(

      '❌ สลับกล้องไม่สำเร็จ: ' +
      (
        error.message ||
        String(error)
      ),

      'error'

    );


    updateButtons();

  }

}


/* =====================================================
   JSONP API
   ===================================================== */

function callAPI(
  action,
  params = {}
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const callbackName =
        'kumonCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object.entries(params)
        .forEach(
          function([
            key,
            value
          ]) {

            if (
              value !== undefined &&
              value !== null
            ) {

              query.set(
                key,
                String(value)
              );

            }

          }
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                'Apps Script ไม่ตอบกลับภายใน 15 วินาที'
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        }
        catch(e) {}


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function(response) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (!response) {

            reject(
              new Error(
                'Apps Script ไม่ส่งข้อมูลกลับมา'
              )
            );

            return;

          }


          if (
            response.success !== true
          ) {

            reject(
              new Error(

                response.error ||
                response.message ||
                'บันทึกข้อมูลไม่สำเร็จ'

              )
            );

            return;

          }


          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              'เชื่อมต่อ Apps Script ไม่สำเร็จ'
            )
          );

        };


      script.async =
        true;


      script.src =
        API_URL +
        '?' +
        query.toString();


      document.head.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   QR SUCCESS
   ===================================================== */

async function onScanSuccess(
  decodedText
) {

  if (
    processing ||
    !decodedText
  ) {

    return;

  }


  const now =
    Date.now();


  /*
   * ป้องกัน QR เดิมยิงซ้ำ
   */

  if (
    decodedText === lastQR &&
    now - lastQRTime < 3000
  ) {

    return;

  }


  lastQR =
    decodedText;


  lastQRTime =
    now;


  processing =
    true;


  updateButtons();


  /*
   * หยุดกล้อง
   */

  await stopCamera();


  /*
   * แสดงผลทันทีว่าอ่าน QR แล้ว
   */

  resultBox.style.display =
    'block';


  resultBox.className =
    'result';


  studentName.textContent =
    'กำลังตรวจสอบ...';


  directionBox.textContent =
    '';


  subjectBox.textContent =
    '';


  timeBox.textContent =
    '';


  durationBox.textContent =
    '';


  rawBox.textContent =
    'QR: ' +
    decodedText;


  setStatus(
    '⏳ อ่าน QR แล้ว — กำลังบันทึกข้อมูล...',
    'loading'
  );


  /*
   * เสียง
   */

  beep(true);


  try {

    /*
     * ส่ง Apps Script
     */

    const data =
      await callAPI(
        'scan',
        {

          branch:
            BRANCH_ID,

          device:
            DEVICE_ID,

          payload:
            decodedText

        }
      );


    /*
     * ชื่อนักเรียน
     */

    studentName.textContent =
      data.fullName ||
      data.studentName ||
      data.studentId ||
      '-';


    /*
     * IN / OUT
     */

    if (
      data.direction ===
      'IN'
    ) {

      directionBox.textContent =
        '🟢 CHECK-IN';

    }

    else if (
      data.direction ===
      'OUT'
    ) {

      directionBox.textContent =
        '🔴 CHECK-OUT';

    }

    else {

      directionBox.textContent =
        data.direction ||
        '';

    }


    /*
     * วิชา
     */

    subjectBox.textContent =
      'วิชา: ' +
      (
        data.subject ||
        '-'
      );


    /*
     * เวลา
     */

    timeBox.textContent =
      'เวลา: ' +
      (
        data.time ||
        '-'
      );


    /*
     * ระยะเวลา
     */

    if (
      data.durationMin !== '' &&
      data.durationMin !== null &&
      data.durationMin !== undefined
    ) {

      durationBox.textContent =
        'เวลาเรียน: ' +
        data.durationMin +
        ' นาที';

    }


    /*
     * สำเร็จ
     */

    resultBox.className =
      'result success';


    setStatus(

      data.message ||

      (
        data.direction ===
        'IN'

          ? '✅ เช็กอินสำเร็จ'

          : data.direction ===
            'OUT'

            ? '✅ เช็กเอาต์สำเร็จ'

            : '✅ บันทึกสำเร็จ'
      ),

      'success'

    );


    beep(true);


  }
  catch(error) {

    console.error(
      'SCAN ERROR:',
      error
    );


    resultBox.className =
      'result error';


    studentName.textContent =
      'บันทึกข้อมูลไม่สำเร็จ';


    directionBox.textContent =
      '';


    subjectBox.textContent =
      '';


    timeBox.textContent =
      '';


    durationBox.textContent =
      '';


    rawBox.textContent =
      'QR: ' +
      decodedText;


    setStatus(

      '❌ ' +
      (
        error.message ||
        error
      ),

      'error'

    );


    beep(false);

  }


  processing =
    false;


  updateButtons();

}


/* =====================================================
   SCAN AGAIN
   ===================================================== */

async function scanAgain() {

  if (processing) {
    return;
  }


  resultBox.style.display =
    'none';


  resultBox.className =
    'result';


  lastQR =
    '';


  lastQRTime =
    0;


  await startCamera();

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
  'load',
  async function() {

    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      setStatus(
        '❌ โหลดระบบ QR Scanner ไม่สำเร็จ',
        'error'
      );


      return;

    }


    setStatus(
      '⏳ กำลังตรวจสอบการเชื่อมต่อ...',
      'loading'
    );


    updateButtons();


    /*
     * ตรวจสอบ Apps Script
     */

    try {

      await callAPI(
        'ping'
      );


      setStatus(
        '🟢 ระบบพร้อม — เชื่อมต่อ Apps Script แล้ว',
        'success'
      );

    }
    catch(error) {

      console.error(
        'Backend ping error:',
        error
      );


      setStatus(
        '⚠️ กล้องพร้อมใช้งาน แต่ยังเชื่อมต่อ Apps Script ไม่ได้',
        'error'
      );

    }

  }
);


/* =====================================================
   PAGE CLOSE
   ===================================================== */

window.addEventListener(
  'beforeunload',
  function() {

    if (
      scanner &&
      cameraRunning
    ) {

      scanner.stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>
