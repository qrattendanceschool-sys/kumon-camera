<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Kumon Central Korat - QR Attendance</title>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f6fa;
      font-family:
        Arial,
        "Noto Sans Thai",
        "Tahoma",
        sans-serif;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 26px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.07);
    }

    .header {
      text-align: center;
    }

    .title {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 25px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 14px;
    }

    .branch {
      font-size: 20px;
      font-weight: 700;
      color: #374151;
    }

    /* CAMERA */

    .camera-card {
      padding: 20px;
    }

    #reader {
      width: 100%;
      min-height: 420px;
      background: #111827;
      border-radius: 22px;
      overflow: hidden;
    }

    #cameraMessage {
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #d1d5db;
      font-size: 22px;
      font-weight: 700;
      padding: 30px;
    }

    /* STATUS */

    .status {
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .status.ok {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.warning {
      background: #fef3c7;
      color: #92400e;
    }

    .status.info {
      background: #dbeafe;
      color: #1e40af;
    }

    /* RESULT */

    .result {
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #e5e7eb;
    }

    .result.success {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .result.error {
      background: #fff7f7;
      border-color: #fca5a5;
    }

    .result-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .result-row {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 13px 16px;
      margin-bottom: 10px;
      font-size: 18px;
    }

    /* BUTTONS */

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 18px 12px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      min-height: 65px;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-start {
      background: #2563eb;
      color: white;
    }

    .btn-stop {
      background: #ef4444;
      color: white;
    }

    .btn-switch {
      background: #6b7280;
      color: white;
    }

    .btn-next {
      width: 100%;
      background: #16a34a;
      color: white;
      margin-top: 10px;
    }

    /* DEBUG */

    .debug {
      background: #111827;
      color: #d1d5db;
      border-radius: 15px;
      padding: 15px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }

    @media (max-width: 700px) {

      body {
        padding: 10px;
      }

      .card {
        padding: 16px;
        border-radius: 18px;
      }

      .title {
        font-size: 27px;
      }

      .subtitle {
        font-size: 19px;
      }

      .branch {
        font-size: 15px;
      }

      #reader,
      #cameraMessage {
        min-height: 330px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      button {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="card header">

    <div class="title">
      📷 Kumon Central Korat
    </div>

    <div class="subtitle">
      สแกน QR เข้า–ออก
    </div>

    <div class="branch">
      Branch: <span id="branchText">B001</span>
      |
      สาขาหลัก
      |
      Device: <span id="deviceText">B001-01</span>
    </div>

  </div>


  <!-- CAMERA -->

  <div class="card camera-card">

    <div id="reader">

      <div id="cameraMessage">
        📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน
      </div>

    </div>

  </div>


  <!-- API STATUS -->

  <div id="apiStatus" class="status warning">
    ⏳ กำลังตรวจสอบการเชื่อมต่อ Apps Script...
  </div>


  <!-- RESULT -->

  <div id="resultBox" style="display:none;"></div>


  <!-- BUTTONS -->

  <div class="card">

    <div class="buttons">

      <button
        id="startBtn"
        class="btn-start"
        onclick="startCamera()"
      >
        📷 เปิดกล้อง
      </button>

      <button
        id="stopBtn"
        class="btn-stop"
        onclick="stopCamera()"
        disabled
      >
        ⛔ ปิดกล้อง
      </button>

      <button
        id="switchBtn"
        class="btn-switch"
        onclick="switchCamera()"
        disabled
      >
        🔄 สลับกล้อง
      </button>

    </div>

  </div>


  <!-- DEBUG -->

  <div id="debug" class="debug"></div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx1pn5AbJYph_x7ZBSC2vVoQV-_fi7BlaHmuzT3uunl6i3wHpQTMJE7rHhyrQmKG1GbiQ/exec";

const BRANCH_ID = "B001";

const DEVICE_ID = "B001-01";


/* =========================================================
   VARIABLES
========================================================= */

let scanner = null;

let cameraRunning = false;

let currentCameraId = null;

let cameras = [];

let lastScannedText = "";

let lastScanTime = 0;

let apiReady = false;

let requestCounter = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const apiStatus =
  document.getElementById("apiStatus");

const resultBox =
  document.getElementById("resultBox");

const debugBox =
  document.getElementById("debug");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const switchBtn =
  document.getElementById("switchBtn");


/* =========================================================
   BASIC UI
========================================================= */

function setApiStatus(type, text) {

  apiStatus.className =
    "status " + type;

  apiStatus.textContent =
    text;
}


function showDebug(text) {

  debugBox.style.display = "block";

  debugBox.textContent =
    text;
}


function hideDebug() {

  debugBox.style.display = "none";

}


/* =========================================================
   JSONP
========================================================= */

/*
   สำคัญมาก

   GitHub Pages กับ Apps Script
   อยู่คนละ domain

   เราจึงไม่ใช้ fetch()

   แต่ใช้ JSONP ผ่าน <script>
*/

function callAppsScript(params, timeout = 10000) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "__qr_callback_" +
      Date.now() +
      "_" +
      (++requestCounter);

    const script =
      document.createElement("script");

    let finished = false;

    const timer =
      setTimeout(() => {

        if (finished) return;

        finished = true;

        cleanup();

        reject(
          new Error(
            "Apps Script ไม่ตอบกลับภายใน " +
            timeout +
            " ms"
          )
        );

      }, timeout);


    function cleanup() {

      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] =
          undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }


    window[callbackName] =
      function(data) {

        if (finished) return;

        finished = true;

        cleanup();

        resolve(data);

      };


    const query =
      new URLSearchParams();

    Object.keys(params).forEach(key => {

      if (
        params[key] !== undefined &&
        params[key] !== null
      ) {

        query.set(
          key,
          params[key]
        );

      }

    });


    query.set(
      "callback",
      callbackName
    );


    script.src =
      APPS_SCRIPT_URL +
      "?" +
      query.toString();


    script.onerror =
      function() {

        if (finished) return;

        finished = true;

        cleanup();

        reject(
          new Error(
            "ไม่สามารถโหลด Apps Script ได้"
          )
        );

      };


    document.head.appendChild(script);

  });

}


/* =========================================================
   TEST APPS SCRIPT
========================================================= */

async function testAppsScript() {

  setApiStatus(
    "warning",
    "⏳ กำลังเชื่อมต่อ Apps Script..."
  );


  try {

    const result =
      await callAppsScript({
        action: "ping"
      });


    console.log(
      "PING RESULT",
      result
    );


    if (
      result &&
      result.success === true
    ) {

      apiReady = true;

      setApiStatus(
        "ok",
        "✅ เชื่อมต่อ Apps Script สำเร็จ"
      );

      hideDebug();

      return true;

    }


    apiReady = false;

    setApiStatus(
      "error",
      "❌ Apps Script ตอบกลับ แต่ข้อมูลไม่ถูกต้อง"
    );

    showDebug(
      JSON.stringify(
        result,
        null,
        2
      )
    );

    return false;


  } catch (error) {

    apiReady = false;

    setApiStatus(
      "error",
      "❌ เชื่อมต่อ Apps Script ไม่สำเร็จ: " +
      error.message
    );


    showDebug(
      "URL:\n" +
      APPS_SCRIPT_URL +
      "\n\nERROR:\n" +
      error.message
    );


    console.error(error);

    return false;

  }

}


/* =========================================================
   CAMERA LIST
========================================================= */

async function loadCameras() {

  try {

    cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้องในอุปกรณ์"
      );

    }


    /*
       เลือกกล้องหลังเป็นค่าเริ่มต้น
    */

    let backCamera =
      cameras.find(camera =>
        /back|rear|environment/i
          .test(camera.label)
      );


    currentCameraId =
      backCamera
        ? backCamera.id
        : cameras[0].id;


    switchBtn.disabled =
      cameras.length < 2;


    return true;


  } catch (error) {

    setApiStatus(
      "error",
      "❌ ไม่สามารถเข้าถึงกล้อง: " +
      error.message
    );


    showDebug(
      "CAMERA ERROR:\n" +
      error.message
    );


    return false;

  }

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

  if (cameraRunning) {

    return;

  }


  /*
     ตรวจ API ก่อน
  */

  if (!apiReady) {

    const ok =
      await testAppsScript();

    if (!ok) {

      return;

    }

  }


  /*
     ขอสิทธิ์ / โหลดกล้อง
  */

  const camerasOK =
    await loadCameras();

  if (!camerasOK) {

    return;

  }


  try {

    if (!scanner) {

      scanner =
        new Html5Qrcode(
          "reader"
        );

    }


    document.getElementById(
      "cameraMessage"
    ).style.display =
      "none";


    await scanner.start(

      currentCameraId,

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      onQrSuccess,

      onQrError

    );


    cameraRunning = true;


    startBtn.disabled = true;

    stopBtn.disabled = false;

    switchBtn.disabled =
      cameras.length < 2;


    setApiStatus(
      "ok",
      "📷 กล้องพร้อมใช้งาน — กรุณานำ QR มาให้กล้องอ่าน"
    );


  } catch (error) {

    cameraRunning = false;

    startBtn.disabled = false;

    stopBtn.disabled = true;

    switchBtn.disabled = true;


    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    setApiStatus(
      "error",
      "❌ เปิดกล้องไม่สำเร็จ: " +
      message
    );


    showDebug(
      "START CAMERA ERROR:\n" +
      message
    );


    console.error(
      "START CAMERA ERROR",
      error
    );

  }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function stopCamera() {

  if (!scanner) {

    return;

  }


  try {

    if (cameraRunning) {

      await scanner.stop();

    }


  } catch (error) {

    console.warn(
      "STOP CAMERA",
      error
    );

  }


  cameraRunning = false;


  startBtn.disabled = false;

  stopBtn.disabled = true;

  switchBtn.disabled =
    cameras.length < 2;


  document.getElementById(
    "cameraMessage"
  ).style.display =
    "flex";


  setApiStatus(
    apiReady
      ? "ok"
      : "warning",
    apiReady
      ? "✅ เชื่อมต่อ Apps Script แล้ว"
      : "⚠️ ยังไม่ได้เชื่อมต่อ Apps Script"
  );

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera() {

  if (
    !scanner ||
    !cameraRunning ||
    cameras.length < 2
  ) {

    return;

  }


  try {

    await scanner.stop();

  } catch (e) {

    console.warn(e);

  }


  const index =
    cameras.findIndex(
      camera =>
        camera.id ===
        currentCameraId
    );


  const nextIndex =
    (index + 1) %
    cameras.length;


  currentCameraId =
    cameras[nextIndex].id;


  try {

    await scanner.start(

      currentCameraId,

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        }

      },

      onQrSuccess,

      onQrError

    );


  } catch (error) {

    setApiStatus(
      "error",
      "❌ สลับกล้องไม่สำเร็จ: " +
      error.message
    );

  }

}


/* =========================================================
   QR SUCCESS
========================================================= */

async function onQrSuccess(
  decodedText,
  decodedResult
) {

  const now =
    Date.now();


  /*
     ป้องกัน QR เดิมยิงซ้ำเร็วเกินไป
  */

  if (
    decodedText ===
    lastScannedText &&
    now - lastScanTime <
    3000
  ) {

    return;

  }


  lastScannedText =
    decodedText;

  lastScanTime =
    now;


  console.log(
    "QR:",
    decodedText
  );


  /*
     ตรวจรูปแบบ

     ตัวอย่าง:
     18040#MATH
  */

  const payload =
    decodedText.trim();


  if (!payload) {

    return;

  }


  setApiStatus(
    "info",
    "⏳ อ่าน QR แล้ว กำลังบันทึกข้อมูล..."
  );


  try {

    const result =
      await callAppsScript({

        action: "scan",

        branch: BRANCH_ID,

        device: DEVICE_ID,

        payload: payload

      });


    console.log(
      "SCAN RESULT",
      result
    );


    if (
      result &&
      result.success === true
    ) {

      showSuccess(
        result,
        payload
      );


      setApiStatus(
        "ok",
        "✅ บันทึกข้อมูลสำเร็จ"
      );


    } else {

      showError(
        result,
        payload
      );


      setApiStatus(
        "error",
        "❌ " +
        (
          result &&
          result.error
            ? result.error
            : "ไม่สามารถบันทึกข้อมูลได้"
        )
      );

    }


  } catch (error) {

    console.error(
      "SCAN ERROR",
      error
    );


    showError(
      {
        error:
          error.message
      },
      payload
    );


    setApiStatus(
      "error",
      "❌ เรียก Apps Script ไม่สำเร็จ: " +
      error.message
    );

  }

}


/* =========================================================
   QR ERROR
========================================================= */

function onQrError(
  errorMessage
) {

  /*
     ไม่ต้องแสดงทุก frame
     เพราะ scanner จะยิง error
     ขณะยังหา QR ไม่เจอ
  */

}


/* =========================================================
   SUCCESS RESULT
========================================================= */

function showSuccess(
  result,
  payload
) {

  resultBox.style.display =
    "block";


  resultBox.className =
    "result success";


  const direction =
    result.direction || "";


  const directionText =
    direction === "IN"
      ? "เข้าเรียน"
      : direction === "OUT"
        ? "ออกเรียน"
        : direction;


  resultBox.innerHTML =

    "<div class='result-title'>" +

      "✅ " +
      escapeHtml(
        result.message ||
        "ดำเนินการสำเร็จ"
      ) +

    "</div>" +

    "<div class='result-row'>" +
      "👤 นักเรียน: " +
      escapeHtml(
        result.fullName ||
        "-"
      ) +
    "</div>" +

    "<div class='result-row'>" +
      "🆔 รหัส: " +
      escapeHtml(
        result.studentId ||
        "-"
      ) +
    "</div>" +

    "<div class='result-row'>" +
      "📚 วิชา: " +
      escapeHtml(
        result.subject ||
        "-"
      ) +
    "</div>" +

    "<div class='result-row'>" +
      "🚪 รายการ: " +
      escapeHtml(
        directionText
      ) +
    "</div>" +

    "<div class='result-row'>" +
      "🕐 เวลา: " +
      escapeHtml(
        result.time ||
        "-"
      ) +
    "</div>" +

    "<button " +
      "class='btn-next' " +
      "onclick='clearResult()'>" +

      "🔎 สแกนคนถัดไป" +

    "</button>";

}


/* =========================================================
   ERROR RESULT
========================================================= */

function showError(
  result,
  payload
) {

  resultBox.style.display =
    "block";


  resultBox.className =
    "result error";


  const message =
    result &&
    result.error
      ? result.error
      : "ไม่สามารถบันทึกข้อมูลได้";


  resultBox.innerHTML =

    "<div class='result-title'>" +

      "❌ " +
      escapeHtml(
        message
      ) +

    "</div>" +

    "<div class='result-row'>" +
      "QR: " +
      escapeHtml(
        payload
      ) +
    "</div>" +

    "<button " +
      "class='btn-next' " +
      "onclick='clearResult()'>" +

      "🔎 ลองสแกนอีกครั้ง" +

    "</button>";

}


/* =========================================================
   CLEAR RESULT
========================================================= */

function clearResult() {

  resultBox.style.display =
    "none";

  resultBox.innerHTML = "";

  lastScannedText = "";

  lastScanTime = 0;


  setApiStatus(
    "ok",
    "📷 พร้อมสแกนคนถัดไป"
  );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
  "load",
  function() {

    /*
       ทดสอบ Apps Script ทันที
       แต่ยังไม่เปิดกล้อง
    */

    testAppsScript();

  }
);


/* =========================================================
   PAGE HIDDEN
========================================================= */

document.addEventListener(
  "visibilitychange",
  async function() {

    if (
      document.hidden &&
      cameraRunning
    ) {

      await stopCamera();

    }

  }
);

</script>

</body>
</html>
